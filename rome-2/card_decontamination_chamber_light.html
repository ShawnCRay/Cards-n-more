<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #8d929b;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .gray {
    color: #6a7280;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #6a7280;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(141,146,155,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #6a7280;
    border-bottom: 1px dashed rgba(141,146,155,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Decontamination Chamber - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="gray">Decontamination</span> Chamber</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">OVERSEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8d929b" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#8d929b" stop-opacity="0.05"/>
              </linearGradient>
              <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.28"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#mistGrad)"/>

            <!-- engineering grid -->
            <g stroke="#8d929b" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- chamber walls -->
            <g filter="url(#glow)">
              <rect x="26" y="30" width="148" height="138" rx="6" fill="url(#wallGrad)" stroke="#8d929b" stroke-width="2" stroke-opacity="0.8"/>
              <rect x="32" y="36" width="136" height="126" rx="4" fill="none" stroke="#8d929b" stroke-width="0.6" stroke-opacity="0.3"/>
              <line x1="26" y1="86" x2="174" y2="86" stroke="#8d929b" stroke-width="0.7" stroke-opacity="0.35"/>
            </g>

            <!-- ceiling spray bar with nozzles -->
            <g filter="url(#glow)">
              <rect x="40" y="38" width="120" height="6" rx="3" fill="#6a7280" opacity="0.4" stroke="#6a7280" stroke-width="0.6"/>
              <circle cx="58" cy="46" r="2.2" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
              <circle cx="86" cy="46" r="2.2" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
              <circle cx="114" cy="46" r="2.2" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
              <circle cx="142" cy="46" r="2.2" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
            </g>

            <!-- falling scouring spray -->
            <g fill="none" stroke="#8d929b" stroke-width="1" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
              <path d="M58 52 C 55 60, 61 68, 57 78"/>
              <path d="M86 52 C 84 62, 87 70, 85 80"/>
              <path d="M114 52 C 116 62, 113 70, 115 80"/>
              <path d="M142 52 C 145 60, 142 68, 146 78"/>
            </g>

            <!-- silhouette of a figure being washed -->
            <g filter="url(#glow)">
              <ellipse cx="100" cy="108" rx="16" ry="20" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.75"/>
              <circle cx="100" cy="82" r="10" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.75"/>
              <line x1="84" y1="112" x2="70" y2="142" stroke="#6a7280" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
              <line x1="116" y1="112" x2="130" y2="142" stroke="#6a7280" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
              <line x1="100" y1="126" x2="100" y2="150" stroke="#6a7280" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
            </g>

            <!-- hatch/grille on the floor -->
            <g filter="url(#glow)">
              <rect x="70" y="156" width="60" height="6" fill="none" stroke="#8d929b" stroke-width="1" opacity="0.35"/>
              <line x1="70" y1="156" x2="130" y2="156" stroke="#8d929b" stroke-width="1.2" opacity="0.5"/>
              <line x1="76" y1="159" x2="76" y2="156" stroke="#8d929b" stroke-width="0.7" opacity="0.4"/>
              <line x1="94" y1="159" x2="94" y2="156" stroke="#8d929b" stroke-width="0.7" opacity="0.4"/>
              <line x1="112" y1="159" x2="112" y2="156" stroke="#8d929b" stroke-width="0.7" opacity="0.4"/>
            </g>

            <!-- low mist / vapor at the base -->
            <g fill="#8d929b" opacity="0.12">
              <ellipse cx="50" cy="164" rx="34" ry="8"/>
              <ellipse cx="100" cy="170" rx="42" ry="9"/>
              <ellipse cx="152" cy="163" rx="32" ry="7"/>
            </g>

            <!-- radiation trefoil (small, left) -->
            <g filter="url(#glow)">
              <circle cx="184" cy="52" r="12" fill="none" stroke="#8d929b" stroke-width="1" opacity="0.5"/>
              <circle cx="184" cy="52" r="2.4" fill="#8d929b" opacity="0.6"/>
              <path d="M184 44 L 181 38 M186 47 L 187 40 M182 47 L 179 42" stroke="#8d929b" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
              <path d="M184 60 L 181 66 M186 57 L 187 64 M182 57 L 179 62" stroke="#8d929b" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
              <path d="M172 52 L 166 47 M176 50 L 171 45 M177 51 L 174 43" stroke="#8d929b" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
              <path d="M196 52 L 202 47 M192 50 L 197 45 M191 51 L 194 43" stroke="#8d929b" stroke-width="1.4" stroke-opacity="0.6" stroke-linecap="round"/>
            </g>

            <!-- droplet details in spray -->
            <g fill="#8d929b" opacity="0.4">
              <circle cx="70" cy="64" r="1"/>
              <circle cx="60" cy="96" r="0.8"/>
              <circle cx="126" cy="60" r="1"/>
              <circle cx="140" cy="92" r="0.8"/>
              <circle cx="96" cy="66" r="0.9"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#8d929b" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="40" y="132">RINSING</text>
              <text x="138" y="128">WASH</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">BEFORE RESEARCH:</div>
          <div class="room-desc">Discard all blueprints from your HAND to the WASTELAND.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CONCRETE</div>

  </div>
</div>

</body>
</html>
