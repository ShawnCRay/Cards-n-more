<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #8a5aad;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .inner-wrap {
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .site-top {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 1mm;
    align-items: center;
    border-bottom: 1.5px solid rgba(138,90,173,0.3);
    padding-bottom: 1.2mm;
  }

  .pop-row {
    display: flex;
    gap: 1.2mm;
    align-items: center;
    justify-content: center;
  }

  .pop-circle {
    width: 4.6mm;
    height: 4.6mm;
    border: 0.5mm solid #8a5aad;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pop-circle svg {
    width: 70%;
    height: 70%;
    display: block;
  }

  .site-name {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #241d12;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .site-image {
    flex: 3;
    min-height: 0;
    margin-top: 1.2mm;
    border: 1.5px solid rgba(138,90,173,0.3);
    border-radius: 2mm;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .site-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .foundation {
    flex: 2;
    min-height: 0;
    margin-top: 1.2mm;
    border: 1.5px solid rgba(138,90,173,0.4);
    border-radius: 2mm;
    padding: 1mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 1.6mm,
        rgba(138,90,173,0.10) 1.6mm, rgba(138,90,173,0.10) 3.2mm),
      repeating-linear-gradient(-45deg, transparent, transparent 1.6mm,
        rgba(138,90,173,0.10) 1.6mm, rgba(138,90,173,0.10) 3.2mm);
  }

  .foundation .f-title {
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #593872;
    margin-bottom: 0.6mm;
  }

  .foundation .f-body {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #241d12;
  }
</style>
<title>High-Tech Components Site Front - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="site-top">
      <div class="pop-row">
        <div class="pop-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="3.5" fill="#8a5aad"/>
            <path d="M5.5 19 c0 -4.5 13 -4.5 13 0 z" fill="#8a5aad"/>
          </svg>
        </div>
        <div class="pop-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="3.5" fill="#8a5aad"/>
            <path d="M5.5 19 c0 -4.5 13 -4.5 13 0 z" fill="#8a5aad"/>
          </svg>
        </div>
        <div class="pop-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="3.5" fill="#8a5aad"/>
            <path d="M5.5 19 c0 -4.5 13 -4.5 13 0 z" fill="#8a5aad"/>
          </svg>
        </div>
      </div>
      <div class="site-name">High-Tech Components</div>
    </div>

    <div class="site-image">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8a5aad" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#8a5aad" stop-opacity="0.03"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <rect width="200" height="200" fill="#ffffff"/>
        <rect width="200" height="200" fill="url(#bgGrad)"/>

        <!-- engineering grid -->
        <g stroke="#8a5aad" stroke-opacity="0.05" stroke-width="0.5">
          <line x1="40" y1="0" x2="40" y2="200"/>
          <line x1="80" y1="0" x2="80" y2="200"/>
          <line x1="120" y1="0" x2="120" y2="200"/>
          <line x1="160" y1="0" x2="160" y2="200"/>
          <line x1="0" y1="40" x2="200" y2="40"/>
          <line x1="0" y1="80" x2="200" y2="80"/>
          <line x1="0" y1="120" x2="200" y2="120"/>
          <line x1="0" y1="160" x2="200" y2="160"/>
        </g>

        <!-- reactor containment with coolant pipes and power conduits -->
        <g filter="url(#glow)">
          <circle cx="100" cy="110" r="38" fill="none" stroke="#8a5aad" stroke-width="1.5" stroke-opacity="0.85"/>
          <circle cx="100" cy="110" r="30" fill="none" stroke="#8a5aad" stroke-width="0.8" stroke-dasharray="3 2.5" stroke-opacity="0.5"/>
          <circle cx="100" cy="110" r="20" fill="none" stroke="#8a5aad" stroke-width="0.8" stroke-opacity="0.6"/>
          <circle cx="100" cy="110" r="2.5" fill="#8a5aad" opacity="0.8"/>
        </g>

        <!-- motherboards and a power core -->
        <g filter="url(#glow)">
          <rect x="46" y="156" width="30" height="18" rx="2" fill="none" stroke="#8a5aad" stroke-width="1" stroke-opacity="0.6"/>
          <line x1="52" y1="162" x2="72" y2="162" stroke="#8a5aad" stroke-width="0.6" opacity="0.5"/>
          <rect x="124" y="156" width="32" height="18" rx="2" fill="none" stroke="#8a5aad" stroke-width="1" stroke-opacity="0.6"/>
          <line x1="130" y1="162" x2="150" y2="162" stroke="#8a5aad" stroke-width="0.6" opacity="0.5"/>
        </g>

        <!-- future-tech accent chips -->
        <g filter="url(#glow)">
          <path d="M46 74 L 54 66 L 58 74 L 50 82 Z" fill="none" stroke="#8a5aad" stroke-width="0.9" stroke-opacity="0.6"/>
          <path d="M150 66 L 158 58 L 162 66 L 154 74 Z" fill="none" stroke="#8a5aad" stroke-width="0.9" stroke-opacity="0.6"/>
          <circle cx="44" cy="96" r="3" fill="none" stroke="#8a5aad" stroke-width="0.9" stroke-opacity="0.6"/>
          <circle cx="156" cy="96" r="3" fill="none" stroke="#8a5aad" stroke-width="0.9" stroke-opacity="0.6"/>
        </g>

        <!-- label text -->
        <g font-family="'Courier New', monospace" fill="#8a5aad" opacity="0.28" font-size="5" letter-spacing="2">
          <text x="56" y="40">REACTOR</text>
          <text x="68" y="180">SITE</text>
        </g>
      </svg>
    </div>

    <div class="foundation">
      <div class="f-title">Foundation</div>
      <div class="f-body">+ 3 materials</div>
    </div>

  </div>
</div>

</body>
</html>
