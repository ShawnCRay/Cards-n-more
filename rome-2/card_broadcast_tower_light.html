<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #3f78a0;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(63,120,160,0.04) 2px, rgba(63,120,160,0.04) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(63,120,160,0.2);
    border-right: 1px solid rgba(63,120,160,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(63,120,160,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .blue {
    color: #3f78a0;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #3f78a0;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(63,120,160,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(63,120,160,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #3f78a0;
    border-bottom: 1px dashed rgba(63,120,160,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(63,120,160,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #3f78a0;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Broadcast Tower - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="blue">Broadcast</span> Tower</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">TRADER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.12"/>
                <stop offset="50%" stop-color="#3f78a0" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.08"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#3f78a0" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- the broadcast tower -->
            <g filter="url(#glow)">
              <!-- mast -->
              <line x1="100" y1="158" x2="100" y2="56" stroke="#3f78a0" stroke-width="1.5" opacity="0.85"/>
              <!-- antenna cross arms -->
              <line x1="84" y1="66" x2="116" y2="66" stroke="#3f78a0" stroke-width="1" opacity="0.7"/>
              <line x1="88" y1="86" x2="112" y2="86" stroke="#3f78a0" stroke-width="0.9" opacity="0.6"/>
              <line x1="90" y1="106" x2="110" y2="106" stroke="#3f78a0" stroke-width="0.8" opacity="0.5"/>
              <!-- guy wires -->
              <line x1="100" y1="158" x2="62" y2="158" stroke="#3f78a0" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.5"/>
              <line x1="100" y1="158" x2="138" y2="158" stroke="#3f78a0" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.5"/>
              <!-- base -->
              <path d="M88 158 L 112 158 L 112 166 L 88 166 Z" fill="url(#towerGrad)" stroke="#3f78a0" stroke-width="1" opacity="0.7"/>
            </g>

            <!-- broadcast waves -->
            <g filter="url(#glow)">
              <path d="M120 56 A 24 24 0 0 1 120 32" fill="none" stroke="#3f78a0" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
              <path d="M126 60 A 34 34 0 0 1 126 28" fill="none" stroke="#3f78a0" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
              <path d="M80 56 A 24 24 0 0 0 80 32" fill="none" stroke="#3f78a0" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
              <path d="M74 60 A 34 34 0 0 0 74 28" fill="none" stroke="#3f78a0" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
            </g>

            <!-- trading: blueprint site swapped for an opponent's completed room -->
            <g filter="url(#glow)">
              <!-- left: blueprint -->
              <rect x="34" y="104" width="20" height="26" rx="2" transform="rotate(-8 44 117)" fill="none" stroke="#3f78a0" stroke-width="1" opacity="0.75"/>
              <line x1="39" y1="112" x2="54" y2="110" stroke="#3f78a0" stroke-width="0.6" opacity="0.5"/>
              <line x1="39" y1="118" x2="56" y2="116" stroke="#3f78a0" stroke-width="0.6" opacity="0.5"/>
              <!-- swap arrows -->
              <line x1="56" y1="112" x2="142" y2="128" stroke="#3f78a0" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.6"/>
              <line x1="144" y1="110" x2="58" y2="134" stroke="#3f78a0" stroke-width="0.9" stroke-dasharray="4 3" opacity="0.6"/>
              <!-- right: opponent's completed room -->
              <path d="M136 96 L 166 96 L 166 144 L 136 144 Z" fill="none" stroke="#3f78a0" stroke-width="1" opacity="0.75"/>
              <path d="M144 96 L 144 144 M152 96 L 152 144" stroke="#3f78a0" stroke-width="0.6" opacity="0.4"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#3f78a0" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="62" y="30">PROPAGANDA</text>
              <text x="70" y="184">BROADCAST</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">UPON COMPLETION:</div>
          <div class="room-desc">Trade this blueprint's site for a completed vault room from an opponent.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CHEMS</div>

  </div>
</div>

</body>
</html>
