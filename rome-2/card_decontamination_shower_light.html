<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #b8452f;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(184,69,47,0.03) 2px, rgba(184,69,47,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(184,69,47,0.2);
    border-right: 1px solid rgba(184,69,47,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(184,69,47,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .red {
    color: #b8452f;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #b8452f;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(184,69,47,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(184,69,47,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #b8452f;
    border-bottom: 1px dashed rgba(184,69,47,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(184,69,47,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #b8452f;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Decontamination Shower - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="red">Decontamination</span> Shower</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">RAIDER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#b8452f" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#b8452f" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="grateGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#b8452f" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#b8452f" stop-opacity="0.28"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#b8452f" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- shower room walls -->
            <g filter="url(#glow)">
              <rect x="34" y="38" width="132" height="136" rx="5" fill="none" stroke="#b8452f" stroke-width="1.5" stroke-opacity="0.85"/>
              <rect x="40" y="44" width="120" height="124" rx="3" fill="none" stroke="#b8452f" stroke-width="0.6" stroke-opacity="0.3"/>
            </g>

            <!-- shower head and pipe (top) -->
            <g filter="url(#glow)">
              <line x1="58" y1="20" x2="58" y2="42" stroke="#b8452f" stroke-width="1.2" opacity="0.8"/>
              <line x1="70" y1="24" x2="140" y2="24" stroke="#b8452f" stroke-width="1" opacity="0.7"/>
              <line x1="100" y1="24" x2="100" y2="44" stroke="#b8452f" stroke-width="0.9" opacity="0.7"/>
              <rect x="98" y="46" width="34" height="6" rx="3" fill="#b8452f" opacity="0.35" stroke="#b8452f" stroke-width="0.7" opacity="0.7"/>
              <circle cx="102" cy="64" r="2.5" fill="none" stroke="#b8452f" stroke-width="0.7" opacity="0.7"/>
              <circle cx="112" cy="64" r="2.5" fill="none" stroke="#b8452f" stroke-width="0.7" opacity="0.7"/>
              <circle cx="122" cy="64" r="2.5" fill="none" stroke="#b8452f" stroke-width="0.7" opacity="0.7"/>
            </g>

            <!-- falling decontamination spray -->
            <g fill="none" stroke="#b8452f" stroke-width="1" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
              <path d="M100 70 C 97 78 103 86 99 94 C 96 102 102 110 98 118"/>
              <path d="M110 70 C 113 76 108 84 112 92 C 115 100 110 106 112 112"/>
              <path d="M120 70 C 123 78 118 86 122 94 C 125 102 120 108 122 116"/>
            </g>

            <!-- dweller under the shower -->
            <g filter="url(#glow)">
              <ellipse cx="111" cy="128" rx="13" ry="18" fill="none" stroke="#b8452f" stroke-width="1.2" opacity="0.8"/>
              <circle cx="111" cy="106" r="8" fill="none" stroke="#b8452f" stroke-width="1.2" opacity="0.8"/>
              <line x1="98" y1="130" x2="88" y2="152" stroke="#b8452f" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
              <line x1="124" y1="130" x2="134" y2="152" stroke="#b8452f" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
              <line x1="111" y1="144" x2="111" y2="162" stroke="#b8452f" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
            </g>

            <!-- rinse vial / count bubbles to the right -->
            <g filter="url(#glow)">
              <circle cx="146" cy="100" r="5" fill="none" stroke="#b8452f" stroke-width="0.8" opacity="0.6"/>
              <circle cx="146" cy="100" r="1.6" fill="#b8452f" opacity="0.6"/>
              <path d="M148 96 A 6 6 0 0 1 146 90" fill="none" stroke="#b8452f" stroke-width="0.7" opacity="0.5"/>
            </g>

            <!-- floor drain grille -->
            <g filter="url(#glow)">
              <rect x="92" y="166" width="38" height="5" fill="url(#grateGrad)" stroke="#b8452f" stroke-width="0.9" opacity="0.6"/>
              <line x1="92" y1="166" x2="130" y2="166" stroke="#b8452f" stroke-width="0.8" opacity="0.4"/>
              <line x1="100" y1="168" x2="100" y2="166" stroke="#b8452f" stroke-width="0.6" opacity="0.4"/>
              <line x1="112" y1="168" x2="112" y2="166" stroke="#b8452f" stroke-width="0.6" opacity="0.4"/>
            </g>

            <!-- bubbles and lather -->
            <g fill="none" stroke="#b8452f" stroke-width="0.7" opacity="0.5">
              <circle cx="86" cy="112" r="2.2"/>
              <circle cx="92" cy="120" r="1.6"/>
              <circle cx="100" cy="130" r="2"/>
              <circle cx="120" cy="122" r="1.4"/>
            </g>

            <!-- action flash (new dweller acts immediately) -->
            <g filter="url(#glow)">
              <path d="M150 40 L 154 32 M150 40 L 160 40 M150 40 L 154 48 M150 40 L 142 40" stroke="#b8452f" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#b8452f" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="54" y="180">RINSE</text>
              <text x="120" y="40">SCRUB</text>
              <text x="40" y="120">DEOX</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">RECRUITER ACTION:</div>
          <div class="room-desc">When you RECRUIT new DWELLERS, they may take their action immediately.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">TECH MANUALS</div>

  </div>
</div>

</body>
</html>
