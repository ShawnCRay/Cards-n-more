<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #5a7a35;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(90,122,53,0.03) 2px, rgba(90,122,53,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(90,122,53,0.2);
    border-right: 1px solid rgba(90,122,53,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(90,122,53,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .green {
    color: #4a6a2c;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #4a6a2c;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(90,122,53,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(90,122,53,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #4a6a2c;
    border-bottom: 1px dashed rgba(90,122,53,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(90,122,53,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #4a6a2c;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Commissary - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="green">Commissary</span></span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#4a6a2c" stroke="#35501f" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#35501f" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">ENGINEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a7a35" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#5a7a35" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5a7a35" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#5a7a35" stop-opacity="0.28"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#5a7a35" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- cafeteria counter -->
            <g filter="url(#glow)">
              <rect x="36" y="96" width="128" height="16" rx="3" fill="url(#counterGrad)" stroke="#5a7a35" stroke-width="1.3" stroke-opacity="0.85"/>
              <line x1="36" y1="104" x2="164" y2="104" stroke="#5a7a35" stroke-width="0.6" stroke-opacity="0.4"/>
              <rect x="40" y="112" width="120" height="10" fill="none" stroke="#5a7a35" stroke-width="0.8" stroke-opacity="0.6"/>
              <circle cx="56" cy="117" r="1.6" fill="none" stroke="#5a7a35" stroke-width="0.7" opacity="0.6"/>
              <circle cx="100" cy="117" r="1.6" fill="none" stroke="#5a7a35" stroke-width="0.7" opacity="0.6"/>
              <circle cx="144" cy="117" r="1.6" fill="none" stroke="#5a7a35" stroke-width="0.7" opacity="0.6"/>
            </g>

            <!-- three identical role cards being played (paired as one) -->
            <g filter="url(#glow)">
              <!-- card 1 -->
              <rect x="52" y="52" width="26" height="38" fill="#ffffff" stroke="#5a7a35" stroke-width="1" opacity="0.9"/>
              <line x1="57" y1="60" x2="73" y2="60" stroke="#5a7a35" stroke-width="0.6" opacity="0.5"/>
              <line x1="57" y1="66" x2="73" y2="66" stroke="#5a7a35" stroke-width="0.6" opacity="0.4"/>
              <circle cx="65" cy="78" r="6" fill="none" stroke="#5a7a35" stroke-width="0.8" opacity="0.6"/>
              <path d="M65 78 L 65 85 M65 85 L 62 90 M65 85 L 68 90" fill="none" stroke="#5a7a35" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
              <!-- card 2 behind -->
              <rect x="66" y="48" width="26" height="38" fill="#ffffff" stroke="#5a7a35" stroke-width="1" opacity="0.85"/>
              <circle cx="79" cy="78" r="6" fill="none" stroke="#5a7a35" stroke-width="0.8" opacity="0.5"/>
            </g>

            <!-- bracket linking the paired cards -->
            <g filter="url(#glow)">
              <path d="M52 50 C 46 50 46 92 52 92" fill="none" stroke="#5a7a35" stroke-width="1.4" opacity="0.8"/>
              <line x1="78" y1="50" x2="78" y2="48" stroke="#5a7a35" stroke-width="1.2" opacity="0.7"/>
              <line x1="78" y1="92" x2="78" y2="94" stroke="#5a7a35" stroke-width="1.2" opacity="0.7"/>
            </g>

            <!-- mysterious stranger sparkle to the right -->
            <g filter="url(#glow)">
              <path d="M126 64 L 128 60 M126 64 L 130 64 M126 64 L 128 68 M126 64 L 122 64" stroke="#5a7a35" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
              <circle cx="126" cy="64" r="2.5" fill="#5a7a35" opacity="0.7"/>
              <!-- "=" pairing indication -->
              <text x="112" y="64" font-family="'Courier New', monospace" fill="#5a7a35" font-size="8" opacity="0.7">=</text>
              <!-- caption underline -->
              <text x="136" y="66" font-family="'Courier New', monospace" fill="#5a7a35" font-size="5" opacity="0.6">STRANGER</text>
            </g>

            <!-- serving trays / rations on the counter -->
            <g filter="url(#glow)">
              <rect x="84" y="88" width="22" height="7" rx="2" fill="none" stroke="#5a7a35" stroke-width="0.8" opacity="0.7"/>
              <rect x="128" y="88" width="18" height="7" rx="2" fill="none" stroke="#5a7a35" stroke-width="0.8" opacity="0.6"/>
            </g>

            <!-- steam wisps -->
            <g fill="none" stroke="#5a7a35" stroke-width="0.8" stroke-linecap="round" opacity="0.5">
              <path d="M92 86 C 90 80 94 76 92 70"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#5a7a35" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="52" y="176">RATIONS</text>
              <text x="130" y="176">MESS</text>
              <text x="86" y="40">DOUBLE</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">PASSIVE:</div>
          <div class="room-desc">You may play 2 cards of the same role as a MYSTERIOUS STRANGER.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">RATIONS</div>

  </div>
</div>

</body>
</html>
