<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #2f5d8a;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(47,93,138,0.04) 2px, rgba(47,93,138,0.04) 4px
    );
  }

  .inner-wrap {
    border: 1px solid rgba(47,93,138,0.2);
    border-right: 1px solid rgba(47,93,138,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(47,93,138,0.3);
    padding-bottom: 1.4mm;
    margin-bottom: 1.4mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .blue {
    color: #2f5d8a;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #2f5d8a;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(47,93,138,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.2mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(47,93,138,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.8;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 0.6mm 1.2mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 5.8pt;
    margin-bottom: 0.4mm;
    color: #2f5d8a;
    border-bottom: 1px dashed rgba(47,93,138,0.2);
    padding-bottom: 0.2mm;
  }

  .room-desc {
    font-size: 5.6pt;
    line-height: 1.25;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(47,93,138,0.3);
    padding-top: 1.4mm;
    margin-top: 1.4mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #2f5d8a;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Mysterious Stranger - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name">The <span class="blue">Mysterious</span> Stranger</span>
    </div>

    <div class="card-body">
      <div class="card-role-bar">ANY</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#2f5d8a" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#2f5d8a" stop-opacity="0.03"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#2f5d8a" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- star emblem -->
            <g filter="url(#glow)">
              <path d="M100 46 l 14.5 29.4 32.5 4.7 -23.5 22.9 5.5 32.5 -29-15.3 -29 15.3 5.5 -32.5 -23.5 -22.9 32.5 -4.7 Z"
                    fill="none" stroke="#2f5d8a" stroke-width="2" stroke-opacity="0.9" stroke-linejoin="round"/>
              <circle cx="100" cy="100" r="4" fill="#2f5d8a" opacity="0.85"/>
            </g>

            <!-- role symbol ring -->
            <g filter="url(#glow)">
              <circle cx="100" cy="100" r="46" fill="none" stroke="#2f5d8a" stroke-width="0.8" stroke-dasharray="2.5 2" stroke-opacity="0.55"/>
              <circle cx="100" cy="100" r="54" fill="none" stroke="#2f5d8a" stroke-width="0.6" stroke-opacity="0.3"/>
            </g>

            <!-- small role icons: any -->
            <g stroke="#2f5d8a" stroke-width="1" stroke-opacity="0.6" fill="none">
              <circle cx="52" cy="72" r="4"/>
              <path d="M46 86 C 46 82, 58 82, 58 86"/>
              <circle cx="148" cy="72" r="4"/>
              <path d="M142 86 C 142 82, 154 82, 154 86"/>
              <rect x="92" y="146" width="16" height="4" rx="1"/>
              <path d="M100 138 L 106 146 L 94 146 Z"/>
            </g>

            <!-- drifting note (radio signal) -->
            <g filter="url(#glow)">
              <path d="M30 150 Q 40 140 50 150" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
              <path d="M44 156 Q 54 146 64 156" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
              <path d="M136 40 Q 146 30 156 40" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
              <path d="M150 46 Q 160 36 170 46" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
            </g>

            <!-- label text -->
            <g font-family="'Courier New', monospace" fill="#2f5d8a" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="74" y="180">ANY ROLE</text>
              <text x="58" y="60">★★★★</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">ANY ROLE:</div>
          <div class="room-desc">Can be used to lead or follow any role.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">WILD</div>

  </div>
</div>

</body>
</html>
