<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #2f5d8a;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-image {
    position: absolute;
    inset: 2mm;
  }

  .card-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
<title>Mysterious Stranger - Light</title>
</head>
<body>

<div class="card-container">
  <div class="card-image">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect width="200" height="200" fill="#ffffff"/>

      <!-- engineering grid -->
      <g stroke="#2f5d8a" stroke-opacity="0.05" stroke-width="0.5">
        <line x1="40" y1="0" x2="40" y2="200"/>
        <line x1="80" y1="0" x2="80" y2="200"/>
        <line x1="120" y1="0" x2="120" y2="200"/>
        <line x1="160" y1="0" x2="160" y2="200"/>
        <line x1="0" y1="40" x2="200" y2="40"/>
        <line x1="0" y1="80" x2="200" y2="80"/>
        <line x1="0" y1="120" x2="200" y2="120"/>
        <line x1="0" y1="160" x2="200" y2="160"/>
      </g>

      <!-- star emblem -->
      <g filter="url(#glow)">
        <path d="M100 46 l 14.5 29.4 32.5 4.7 -23.5 22.9 5.5 32.5 -29-15.3 -29 15.3 5.5 -32.5 -23.5 -22.9 32.5 -4.7 Z"
              fill="none" stroke="#2f5d8a" stroke-width="2" stroke-opacity="0.9" stroke-linejoin="round"/>
        <circle cx="100" cy="100" r="4" fill="#2f5d8a" opacity="0.85"/>
      </g>

      <!-- role symbol ring -->
      <g filter="url(#glow)">
        <circle cx="100" cy="100" r="46" fill="none" stroke="#2f5d8a" stroke-width="0.8" stroke-dasharray="2.5 2" stroke-opacity="0.55"/>
        <circle cx="100" cy="100" r="54" fill="none" stroke="#2f5d8a" stroke-width="0.6" stroke-opacity="0.3"/>
      </g>

      <!-- small role icons: any -->
      <g stroke="#2f5d8a" stroke-width="1" stroke-opacity="0.6" fill="none">
        <circle cx="52" cy="72" r="4"/>
        <path d="M46 86 C 46 82, 58 82, 58 86"/>
        <circle cx="148" cy="72" r="4"/>
        <path d="M142 86 C 142 82, 154 82, 154 86"/>
        <rect x="92" y="146" width="16" height="4" rx="1"/>
        <path d="M100 138 L 106 146 L 94 146 Z"/>
      </g>

      <!-- drifting note (radio signal) -->
      <g filter="url(#glow)">
        <path d="M30 150 Q 40 140 50 150" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
        <path d="M44 156 Q 54 146 64 156" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
        <path d="M136 40 Q 146 30 156 40" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
        <path d="M150 46 Q 160 36 170 46" fill="none" stroke="#2f5d8a" stroke-width="0.8" opacity="0.4"/>
      </g>
    </svg>
  </div>
</div>

</body>
</html>
