<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 63.5mm; height: 88.9mm; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
  .card-container {
    width: 63.5mm; height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #c89a3c;
    border-radius: 3.5mm;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .card-container::before {
    content: ''; position: absolute; inset: 0; z-index: 10;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(200,154,60,0.03) 2px, rgba(200,154,60,0.03) 4px);
    pointer-events: none;
  }
  .inner-wrap {
    border: 1px solid rgba(200,154,60,0.2);
    margin: 2mm; padding: 2mm; flex: 1;
    display: flex; flex-direction: column; position: relative; z-index: 1;
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1.5px solid rgba(200,154,60,0.3);
    padding-bottom: 1.8mm; margin-bottom: 1.8mm; flex-shrink: 0;
  }
  .card-name {
    color: #241d12; font-weight: 700; font-size: 8pt; letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-name .accent { color: #c89a3c; }
  .card-caps {
    border: 1.5px solid #c89a3c;
    padding: 0.5mm 2mm; font-size: 8pt; font-weight: 700; color: #c89a3c;
    border-radius: 2px; background: rgba(200,154,60,0.08);
    white-space: nowrap; flex-shrink: 0;
  }
  .card-body { display: flex; gap: 2mm; flex: 1; min-height: 0; }
  .card-role-bar {
    writing-mode: vertical-lr; text-orientation: mixed;
    font-size: 7.5pt; letter-spacing: 4px; color: #c89a3c; font-weight: 700; opacity: 0.85;
    border-right: 1.5px solid rgba(200,154,60,0.2);
    padding-right: 1.5mm; white-space: nowrap; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase;
  }
  .card-center { flex: 1; display: flex; flex-direction: column; gap: 1.8mm; min-width: 0; }
  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(200,154,60,0.3); border-radius: 2mm;
    background: #ffffff;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; min-height: 0;
  }
  .card-image-box svg { width: 100%; height: 100%; display: block; }
  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12); border-radius: 2mm;
    padding: 1.5mm; background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden; display: flex; flex-direction: column; justify-content: center; min-height: 0;
  }
  .room-title {
    font-weight: 700; text-transform: uppercase; font-size: 6pt;
    margin-bottom: 0.8mm; color: #c89a3c;
    border-bottom: 1px dashed rgba(200,154,60,0.2); padding-bottom: 0.5mm;
  }
  .room-desc { font-size: 5.8pt; line-height: 1.35; color: #241d12; }
  .card-footer {
    border-top: 1.5px solid rgba(200,154,60,0.3);
    padding-top: 1.8mm; margin-top: 1.8mm; text-align: center;
    font-size: 7.5pt; letter-spacing: 3px; color: #c89a3c;
    font-weight: 700; text-transform: uppercase; flex-shrink: 0;
  }
</style>
<title>Armored Watchtower - Light</title>
</head>
<body>
<div class="card-container">
  <div class="inner-wrap">
    <div class="card-header">
      <span class="card-name"><span class="accent">Armored</span> Watchtower</span>
      <span class="card-caps">1 CAP</span>
    </div>
    <div class="card-body">
      <div class="card-role-bar">SCAVENGER</div>
      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#f5f5f5" />
              </linearGradient>
              <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#c89a3c" stop-opacity="0.25" />
                <stop offset="100%" stop-color="#c89a3c" stop-opacity="0" />
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
            <rect width="200" height="200" fill="url(#sky)" />
            <!-- ground -->
            <rect x="0" y="160" width="200" height="40" fill="#f0f0f0" />
            <line x1="0" y1="160" x2="200" y2="160" stroke="#c89a3c" stroke-opacity="0.12" stroke-width="0.5" />
            <!-- tower legs -->
            <g filter="url(#glow)">
              <rect x="82" y="80" width="6" height="80" fill="#c89a3c" opacity="0.3" />
              <rect x="112" y="80" width="6" height="80" fill="#c89a3c" opacity="0.3" />
              <line x1="85" y1="100" x2="115" y2="120" stroke="#c89a3c" stroke-width="1.5" opacity="0.2" />
              <line x1="115" y1="100" x2="85" y2="120" stroke="#c89a3c" stroke-width="1.5" opacity="0.2" />
              <line x1="85" y1="130" x2="115" y2="145" stroke="#c89a3c" stroke-width="1.5" opacity="0.15" />
              <line x1="115" y1="130" x2="85" y2="145" stroke="#c89a3c" stroke-width="1.5" opacity="0.15" />
            </g>
            <!-- tower platform -->
            <g filter="url(#glow)">
              <rect x="70" y="72" width="60" height="10" rx="1" fill="#c89a3c" opacity="0.45" />
              <rect x="72" y="70" width="56" height="4" rx="1" fill="#c89a3c" opacity="0.25" />
            </g>
            <!-- guard rails -->
            <g filter="url(#glow)">
              <rect x="68" y="65" width="2" height="12" fill="#c89a3c" opacity="0.35" />
              <rect x="130" y="65" width="2" height="12" fill="#c89a3c" opacity="0.35" />
              <rect x="68" y="65" width="64" height="2" fill="#c89a3c" opacity="0.25" />
              <rect x="80" y="65" width="2" height="7" fill="#c89a3c" opacity="0.25" />
              <rect x="92" y="65" width="2" height="7" fill="#c89a3c" opacity="0.25" />
              <rect x="104" y="65" width="2" height="7" fill="#c89a3c" opacity="0.25" />
              <rect x="116" y="65" width="2" height="7" fill="#c89a3c" opacity="0.25" />
            </g>
            <!-- searchlight -->
            <g filter="url(#glow)">
              <rect x="96" y="48" width="8" height="18" rx="2" fill="#c89a3c" opacity="0.55" />
              <circle cx="100" cy="48" r="6" fill="none" stroke="#c89a3c" stroke-width="1.5" opacity="0.45" />
              <circle cx="100" cy="48" r="3" fill="#c89a3c" opacity="0.35" />
              <polygon points="100,48 30,10 170,10" fill="url(#beam)" />
            </g>
            <!-- rivets -->
            <circle cx="75" cy="77" r="1" fill="#c89a3c" opacity="0.4" />
            <circle cx="125" cy="77" r="1" fill="#c89a3c" opacity="0.4" />
            <circle cx="100" cy="77" r="1" fill="#c89a3c" opacity="0.4" />
            <!-- fence posts -->
            <rect x="35" y="155" width="3" height="20" fill="#c89a3c" opacity="0.12" />
            <rect x="162" y="155" width="3" height="20" fill="#c89a3c" opacity="0.12" />
          </svg>
        </div>
        <div class="card-text-box">
          <div class="room-title">VAULT DEFENSE:</div>
          <div class="room-desc">End of Round: RESEARCH if you lost a card to RAIDER action this round.</div>
        </div>
      </div>
    </div>
    <div class="card-footer">SCRAP METAL</div>
  </div>
</div>
</body>
</html>
