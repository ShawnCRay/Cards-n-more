<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #8d879b;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .gray {
    color: #6a7280;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #6a7280;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(141,146,155,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #6a7280;
    border-bottom: 1px dashed rgba(141,146,155,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Reinforced Vault Door - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="gray">Reinforced</span> Vault Door</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">OVERSEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8d929b" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#8d929b" stop-opacity="0.05"/>
              </linearGradient>
              <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.30"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>

            <rect width="200" height="200" fill="url(#metalGrad)"/>

            <!-- engineering grid -->
            <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- concrete frame around the door -->
            <g filter="url(#glow)">
              <rect x="30" y="40" width="140" height="128" rx="5" fill="none" stroke="#6a7280" stroke-width="2" stroke-opacity="0.9"/>
              <!-- corner bolts -->
              <circle cx="42" cy="52" r="3" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.8"/>
              <circle cx="158" cy="52" r="3" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.8"/>
              <circle cx="42" cy="156" r="3" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.8"/>
              <circle cx="158" cy="156" r="3" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.8"/>
              <line x1="42" y1="52" x2="42" y2="49" stroke="#6a7280" stroke-width="0.7" opacity="0.5"/>
              <line x1="42" y1="55" x2="42" y2="50" stroke="#6a7280" stroke-width="0.7" opacity="0.5"/>
            </g>

            <!-- the round reinforced door -->
            <g filter="url(#glow)">
              <circle cx="100" cy="104" r="52" fill="url(#doorGrad)" stroke="#6a7280" stroke-width="2" stroke-opacity="0.95"/>
              <circle cx="100" cy="104" r="44" fill="none" stroke="#6a7280" stroke-width="0.8" stroke-opacity="0.4"/>
              <!-- rivets around the door -->
              <circle cx="100" cy="55" r="1.6" fill="#6a7280" opacity="0.7"/>
              <circle cx="100" cy="153" r="1.6" fill="#6a7280" opacity="0.7"/>
              <circle cx="51" cy="104" r="1.6" fill="#6a7280" opacity="0.7"/>
              <circle cx="149" cy="104" r="1.6" fill="#6a7280" opacity="0.7"/>
              <circle cx="65" cy="69" r="1.5" fill="#6a7280" opacity="0.6"/>
              <circle cx="135" cy="69" r="1.5" fill="#6a7280" opacity="0.6"/>
              <circle cx="135" cy="139" r="1.5" fill="#6a7280" opacity="0.6"/>
              <circle cx="65" cy="139" r="1.5" fill="#6a7280" opacity="0.6"/>
            </g>

            <!-- hand wheel / locking hub -->
            <g filter="url(#glow)">
              <circle cx="100" cy="104" r="20" fill="none" stroke="#6a7280" stroke-width="1.5" stroke-opacity="0.85"/>
              <circle cx="100" cy="104" r="6" fill="none" stroke="#6a7280" stroke-width="1.5" stroke-opacity="0.9"/>
              <circle cx="100" cy="104" r="2.2" fill="#6a7280" opacity="0.9"/>
              <g stroke="#6a7280" stroke-width="1.1" stroke-opacity="0.6" fill="none">
                <line x1="100" y1="84" x2="100" y2="66"/>
                <line x1="100" y1="124" x2="100" y2="142"/>
                <line x1="80" y1="104" x2="62" y2="104"/>
                <line x1="120" y1="104" x2="138" y2="104"/>
                <line x1="86" y1="90" x2="72" y2="76"/>
                <line x1="114" y1="90" x2="128" y2="76"/>
                <line x1="114" y1="118" x2="128" y2="132"/>
                <line x1="86" y1="118" x2="72" y2="132"/>
              </g>
              <g fill="#6a7280" opacity="0.75">
                <circle cx="100" cy="56" r="2"/>
                <circle cx="100" cy="152" r="2"/>
                <circle cx="52" cy="104" r="2"/>
                <circle cx="148" cy="104" r="2"/>
                <circle cx="66" cy="70" r="2"/>
                <circle cx="134" cy="70" r="2"/>
                <circle cx="134" cy="138" r="2"/>
                <circle cx="66" cy="138" r="2"/>
              </g>
            </g>

            <!-- hazard stripes bottom-left corner -->
            <g stroke="#6a7280" stroke-opacity="0.3" stroke-width="2" fill="none">
              <line x1="30" y1="168" x2="52" y2="146"/>
              <line x1="38" y1="168" x2="60" y2="146"/>
              <line x1="46" y1="168" x2="68" y2="146"/>
              <line x1="54" y1="168" x2="76" y2="146"/>
            </g>

            <!-- keypad / access marker -->
            <g fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.5">
              <rect x="150" y="88" width="18" height="24" rx="2"/>
              <circle cx="159" cy="94" r="1.5"/>
              <circle cx="167" cy="94" r="1.5"/>
              <circle cx="159" cy="101" r="1.5"/>
              <circle cx="167" cy="101" r="1.5"/>
              <circle cx="159" cy="108" r="1.5"/>
              <circle cx="167" cy="108" r="1.5"/>
            </g>

            <!-- label text -->
            <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="38" y="78">LOCKED</text>
              <text x="152" y="60">VAULT</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">PASSIVE:</div>
          <div class="room-desc">Immune to RAIDER demands. Endgame: +1 Cap for every two materials in your STOCKPILE.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CONCRETE</div>

  </div>
</div>

</body>
</html>
