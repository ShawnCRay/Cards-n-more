<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #6a7280;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.4mm;
    margin-bottom: 1.4mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .gray {
    color: #6a7280;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #6a7280;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(141,146,155,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.2mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.8;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 0.6mm 1.2mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 5.8pt;
    margin-bottom: 0.4mm;
    color: #6a7280;
    border-bottom: 1px dashed rgba(141,146,155,0.2);
    padding-bottom: 0.2mm;
  }

  .room-desc {
    font-size: 5.6pt;
    line-height: 1.25;
    color: #241d12;
  }

  .room-section {
    display: flex;
    flex-direction: column;
  }

  .room-section + .room-section {
    margin-top: 0.6mm;
    padding-top: 0.4mm;
    border-top: 1px solid rgba(141,146,155,0.2);
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.4mm;
    margin-top: 1.4mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>High-Security Archives - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="gray">High-Security</span> Archives</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">OVERSEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="vaultGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.14"/>
                <stop offset="50%" stop-color="#6a7280" stop-opacity="0.30"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.10"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- the secure archive vault door -->
            <g filter="url(#glow)">
              <path d="M58 60 L 142 60 L 142 168 L 58 168 Z" fill="url(#vaultGrad)" stroke="#6a7280" stroke-width="1.5" stroke-opacity="0.85"/>
              <circle cx="100" cy="136" r="8" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.75"/>
              <circle cx="100" cy="136" r="3.4" fill="#6a7280" opacity="0.7"/>
              <!-- vault spoke handle -->
              <line x1="100" y1="120" x2="100" y2="126" stroke="#6a7280" stroke-width="1" opacity="0.6"/>
              <line x1="100" y1="146" x2="100" y2="152" stroke="#6a7280" stroke-width="1" opacity="0.6"/>
            </g>

            <!-- archive records behind a sealed rack -->
            <g filter="url(#glow)">
              <rect x="40" y="30" width="20" height="26" rx="1.5" fill="none" stroke="#6a7280" stroke-width="0.9" opacity="0.65"/>
              <line x1="46" y1="36" x2="56" y2="36" stroke="#6a7280" stroke-width="0.6" opacity="0.5"/>
              <line x1="46" y1="41" x2="56" y2="41" stroke="#6a7280" stroke-width="0.6" opacity="0.5"/>
              <line x1="46" y1="46" x2="54" y2="46" stroke="#6a7280" stroke-width="0.6" opacity="0.5"/>
              <!-- padlock -->
              <rect x="104" y="54" width="10" height="8" rx="2" fill="none" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <path d="M105 54 A 4 4 0 0 1 113 54" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
            </g>

            <!-- shared POPULATION ledger panel (right) -->
            <g filter="url(#glow)">
              <rect x="150" y="66" width="34" height="22" rx="2" fill="none" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <rect x="164" y="44" width="20" height="16" rx="1.5" fill="#6a7280" fill-opacity="0.10" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
              <text x="97" y="20" font-family="'Courier New', monospace" fill="#6a7280" font-size="7" opacity="0.5">=</text>
            </g>

            <!-- reduced POPULATION cost: one pip dropping -->
            <g filter="url(#glow)">
              <circle cx="100" cy="176" r="2.6" fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.6"/>
              <path d="M96 182 L 104 182" stroke="#6a7280" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="30" y="22">ARCHIVE</text>
              <text x="30" y="52">VAULT</text>
              <text x="152" y="80">POP</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-section">
            <div class="room-title">PASSIVE:</div>
            <div class="room-desc">Your POPULATION counts as the highest player's.</div>
          </div>
          <div class="room-section">
            <div class="room-title">LOSE 1 POPULATION:</div>
            <div class="room-desc">Execute a completed room's "Upon Completion" effect.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer">CONCRETE</div>

  </div>
</div>

</body>
</html>
