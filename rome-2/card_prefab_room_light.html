<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #3f78a0;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(63,120,160,0.03) 2px, rgba(63,120,160,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(63,120,160,0.2);
    border-right: 1px solid rgba(63,120,160,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(63,120,160,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .blue {
    color: #3f78a0;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #3f78a0;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(63,120,160,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(63,120,160,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #3f78a0;
    border-bottom: 1px dashed rgba(63,120,160,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(63,120,160,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #3f78a0;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Prefab Room - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="blue">Prefab</span> Room</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">TRADER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.12"/>
                <stop offset="50%" stop-color="#3f78a0" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.08"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#skyGrad)"/>

            <!-- engineering grid -->
            <g stroke="#3f78a0" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- ground line -->
            <line x1="20" y1="168" x2="180" y2="168" stroke="#3f78a0" stroke-opacity="0.25" stroke-width="1"/>

            <!-- modular panel stack (supply) on the left -->
            <g filter="url(#glow)">
              <rect x="30" y="120" width="44" height="7" fill="#3f78a0" opacity="0.28"/>
              <rect x="31" y="112" width="42" height="7" fill="#3f78a0" opacity="0.32"/>
              <rect x="32" y="104" width="40" height="7" fill="#3f78a0" opacity="0.36"/>
            </g>

            <!-- the completed prefab room housing in the center -->
            <g filter="url(#glow)">
              <!-- main housing -->
              <rect x="78" y="68" width="88" height="100" rx="4" fill="url(#panelGrad)" stroke="#3f78a0" stroke-width="1.8" stroke-opacity="0.9"/>
              <!-- roof -->
              <path d="M84 68 L 160 68 L 152 52 L 92 52 Z" fill="none" stroke="#3f78a0" stroke-width="1.5" stroke-opacity="0.85"/>
              <line x1="92" y1="52" x2="152" y2="52" stroke="#3f78a0" stroke-width="1.5" stroke-opacity="0.85"/>
              <!-- door -->
              <rect x="110" y="92" width="24" height="34" rx="2" fill="none" stroke="#3f78a0" stroke-width="1.2" stroke-opacity="0.8"/>
              <circle cx="116" cy="120" r="1.3" fill="#3f78a0" opacity="0.7"/>
              <!-- window panel -->
              <rect x="84" y="160" width="76" height="8" fill="none" stroke="#3f78a0" stroke-width="0.8" stroke-opacity="0.4"/>
              <line x1="84" y1="130" x2="160" y2="130" stroke="#3f78a0" stroke-width="0.6" stroke-opacity="0.3"/>
            </g>

            <!-- panel being slotted into place (instant completion) -->
            <g filter="url(#glow)">
              <rect x="116" y="140" width="46" height="22" rx="2" transform="rotate(-18 139 151)" fill="#3f78a0" opacity="0.18"/>
              <line x1="120" y1="146" x2="156" y2="140" transform="rotate(-18 139 151)" stroke="#3f78a0" stroke-width="0.8" opacity="0.55"/>
              <line x1="158" y1="152" x2="158" y2="160" stroke="#3f78a0" stroke-width="1" stroke-opacity="0.6"/>
            </g>

            <!-- a crane hook dangling above ready to place -->
            <g filter="url(#glow)">
              <line x1="122" y1="28" x2="122" y2="44" stroke="#3f78a0" stroke-width="1.2" stroke-opacity="0.6"/>
              <path d="M116 46 C 116 44, 128 44, 128 46" fill="none" stroke="#3f78a0" stroke-width="1.2" stroke-opacity="0.6"/>
              <line x1="116" y1="46" x2="116" y2="50" stroke="#3f78a0" stroke-width="1" stroke-opacity="0.6"/>
              <line x1="128" y1="46" x2="128" y2="50" stroke="#3f78a0" stroke-width="1" stroke-opacity="0.6"/>
            </g>

            <!-- bolts on the completed room -->
            <g fill="#3f78a0" opacity="0.6">
              <circle cx="86" cy="78" r="1.6"/>
              <circle cx="158" cy="78" r="1.6"/>
              <circle cx="86" cy="160" r="1.6"/>
              <circle cx="158" cy="160" r="1.6"/>
            </g>

            <!-- schematic / blueprint label -->
            <g font-family="'Courier New', monospace" fill="#3f78a0" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="34" y="150">MB-1</text>
              <text x="146" y="34">PRE-<tspan>FAB</tspan></text>
              <text x="120" y="186">SNAP</text>
            </g>

            <!-- motion / speed ticks beside the slotting panel -->
            <g stroke="#3f78a0" stroke-opacity="0.45" stroke-width="0.9" stroke-linecap="round">
              <line x1="160" y1="140" x2="164" y2="136"/>
              <line x1="162" y1="148" x2="167" y2="144"/>
              <line x1="164" y1="156" x2="169" y2="152"/>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">OVERSEER ACTION:</div>
          <div class="room-desc">You may instantly complete this vault room by supplying all remaining materials at once.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CHEMS</div>

  </div>
</div>

</body>
</html>
