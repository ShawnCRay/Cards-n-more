<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #b8452f;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(184,69,47,0.03) 2px, rgba(184,69,47,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(184,69,47,0.2);
    border-right: 1px solid rgba(184,69,47,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(184,69,47,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .red {
    color: #b8452f;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #b8452f;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(184,69,47,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(184,69,47,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #b8452f;
    border-bottom: 1px dashed rgba(184,69,47,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(184,69,47,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #b8452f;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Assembly Support Rig - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="red">Assembly</span> Support Rig</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">RAIDER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#b8452f" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#b8452f" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="trussGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#b8452f" stop-opacity="0.14"/>
                <stop offset="100%" stop-color="#b8452f" stop-opacity="0.30"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#b8452f" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <line x1="20" y1="172" x2="180" y2="172" stroke="#b8452f" stroke-opacity="0.25" stroke-width="1"/>

            <!-- the portal/gantry frame of the rig -->
            <g filter="url(#glow)">
              <rect x="44" y="34" width="112" height="120" rx="3" fill="url(#trussGrad)" stroke="#b8452f" stroke-width="1.6" stroke-opacity="0.85"/>
              <line x1="44" y1="72" x2="156" y2="72" stroke="#b8452f" stroke-width="0.7" stroke-opacity="0.45"/>
              <line x1="44" y1="112" x2="156" y2="112" stroke="#b8452f" stroke-width="0.7" stroke-opacity="0.45"/>
              <line x1="44" y1="92" x2="156" y2="92" stroke="#b8452f" stroke-width="0.5" stroke-opacity="0.25"/>
            </g>

            <!-- under-construction room frame (scaffold structure) -->
            <g filter="url(#glow)">
              <rect x="60" y="84" width="80" height="70" fill="none" stroke="#b8452f" stroke-width="1.2" stroke-opacity="0.75" stroke-dasharray="6 4"/>
              <!-- diagonal bracing -->
              <line x1="60" y1="84" x2="140" y2="154" stroke="#b8452f" stroke-width="0.8" stroke-opacity="0.5"/>
              <line x1="140" y1="84" x2="60" y2="154" stroke="#b8452f" stroke-width="0.8" stroke-opacity="0.5"/>
              <line x1="60" y1="84" x2="140" y2="84" stroke="#b8452f" stroke-width="0.8" stroke-opacity="0.5"/>
            </g>

            <!-- material resource being moved in (from wasteland) -->
            <g filter="url(#glow)">
              <!-- falling material unit from top -->
              <circle cx="118" cy="52" r="8" fill="none" stroke="#b8452f" stroke-width="1.2" opacity="0.8"/>
              <circle cx="118" cy="52" r="3" fill="#b8452f" opacity="0.6"/>
              <line x1="118" y1="36" x2="118" y2="44" stroke="#b8452f" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
              <!-- downward drop arrow -->
              <line x1="118" y1="60" x2="118" y2="86" stroke="#b8452f" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
              <path d="M112 82 L 118 90 L 124 82" fill="none" stroke="#b8452f" stroke-width="0.8" opacity="0.55"/>
            </g>

            <!-- support arms / robotic assembly hands -->
            <g stroke="#b8452f" stroke-width="0.9" stroke-linecap="round" opacity="0.6">
              <path d="M44 70 L 34 80 L 34 92"/>
              <path d="M156 70 L 166 80 L 166 92"/>
              <path d="M64 40 L 56 30"/>
              <path d="M136 40 L 144 30"/>
            </g>
            <circle cx="28" cy="94" r="4" fill="none" stroke="#b8452f" stroke-width="1" opacity="0.6"/>
            <circle cx="172" cy="94" r="4" fill="none" stroke="#b8452f" stroke-width="1" opacity="0.6"/>

            <!-- welding spark at one joint -->
            <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <g fill="#b8452f" filter="url(#spark)">
              <circle cx="140" cy="120" r="1.2" opacity="0.85"/>
              <line x1="140" y1="116" x2="140" y2="114" stroke="#b8452f" stroke-width="0.7" opacity="0.6"/>
              <line x1="140" y1="124" x2="140" y2="126" stroke="#b8452f" stroke-width="0.7" opacity="0.6"/>
              <line x1="136" y1="120" x2="134" y2="120" stroke="#b8452f" stroke-width="0.7" opacity="0.6"/>
              <line x1="144" y1="120" x2="146" y2="120" stroke="#b8452f" stroke-width="0.7" opacity="0.6"/>
            </g>

            <!-- corner bolts on the gantry -->
            <g fill="#b8452f" opacity="0.7">
              <circle cx="48" cy="38" r="1.8"/>
              <circle cx="152" cy="38" r="1.8"/>
              <circle cx="48" cy="150" r="1.8"/>
              <circle cx="152" cy="150" r="1.8"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#b8452f" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="70" y="52">RIG</text>
              <text x="72" y="176">SUPPLY</text>
              <text x="146" y="66">AUTO</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">OVERSEER ACTION:</div>
          <div class="room-desc">Move 1 card from the WASTELAND to an under-construction room.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">TECH MANUALS</div>

  </div>
</div>

</body>
</html>
