<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #8a5aad;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(138,90,173,0.03) 2px, rgba(138,90,173,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(138,90,173,0.2);
    border-right: 1px solid rgba(138,90,173,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(138,90,173,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .purple {
    color: #8a5aad;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #8a5aad;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(138,90,173,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(138,90,173,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #8a5aad;
    border-bottom: 1px dashed rgba(138,90,173,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(138,90,173,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #8a5aad;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Cryo-Stasis Vault - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="purple">Cryo-Stasis</span> Vault</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">RECRUITER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="frostGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8a5aad" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#8a5aad" stop-opacity="0.04"/>
              </linearGradient>
              <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#8a5aad" stop-opacity="0.10"/>
                <stop offset="50%" stop-color="#8a5aad" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#8a5aad" stop-opacity="0.06"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#frostGrad)"/>

            <!-- engineering grid -->
            <g stroke="#8a5aad" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- vault wall backdrop -->
            <g filter="url(#glow)">
              <rect x="30" y="28" width="140" height="152" rx="6" fill="none" stroke="#8a5aad" stroke-width="1.6" stroke-opacity="0.7"/>
              <rect x="36" y="34" width="128" height="140" rx="4" fill="none" stroke="#8a5aad" stroke-width="0.6" stroke-opacity="0.25"/>
              <line x1="30" y1="118" x2="170" y2="118" stroke="#8a5aad" stroke-width="0.6" stroke-opacity="0.3"/>
            </g>

            <!-- row of cryo pods -->
            <g filter="url(#glow)">
              <!-- pod 1 -->
              <rect x="48" y="80" width="34" height="88" rx="12" fill="url(#tubeGrad)" stroke="#8a5aad" stroke-width="1.4" stroke-opacity="0.9"/>
              <ellipse cx="65" cy="80" rx="17" ry="6" fill="none" stroke="#8a5aad" stroke-width="1" stroke-opacity="0.8"/>
              <line x1="49" y1="124" x2="81" y2="124" stroke="#8a5aad" stroke-width="0.7" stroke-opacity="0.4"/>
              <!-- figure inside pod 1 -->
              <circle cx="65" cy="94" r="5" fill="none" stroke="#8a5aad" stroke-width="0.9" opacity="0.7"/>
              <rect x="61" y="99" width="8" height="14" rx="3" fill="none" stroke="#8a5aad" stroke-width="0.8" opacity="0.6"/>
              <line x1="65" y1="113" x2="65" y2="122" stroke="#8a5aad" stroke-width="0.8" opacity="0.6"/>

              <!-- pod 2 (center, primary) -->
              <rect x="88" y="70" width="36" height="98" rx="13" fill="url(#tubeGrad)" stroke="#8a5aad" stroke-width="1.6" stroke-opacity="0.95"/>
              <ellipse cx="106" cy="70" rx="18" ry="6.5" fill="none" stroke="#8a5aad" stroke-width="1.1" stroke-opacity="0.85"/>
              <line x1="89" y1="118" x2="123" y2="118" stroke="#8a5aad" stroke-width="0.7" stroke-opacity="0.4"/>
              <!-- figure inside pod 2 -->
              <circle cx="106" cy="84" r="5.5" fill="none" stroke="#8a5aad" stroke-width="1" opacity="0.75"/>
              <rect x="101" y="90" width="10" height="16" rx="4" fill="none" stroke="#8a5aad" stroke-width="0.9" opacity="0.65"/>
              <line x1="106" y1="106" x2="106" y2="117" stroke="#8a5aad" stroke-width="0.9" opacity="0.65"/>
              <!-- pod status light -->
              <circle cx="106" cy="46" r="3.5" fill="none" stroke="#8a5aad" stroke-width="1" opacity="0.8"/>
              <circle cx="106" cy="46" r="1.4" fill="#8a5aad" opacity="0.9"/>

              <!-- pod 3 -->
              <rect x="130" y="86" width="32" height="82" rx="11" fill="url(#tubeGrad)" stroke="#8a5aad" stroke-width="1.3" stroke-opacity="0.85"/>
              <ellipse cx="146" cy="86" rx="16" ry="5.5" fill="none" stroke="#8a5aad" stroke-width="1" stroke-opacity="0.8"/>
              <line x1="131" y1="126" x2="161" y2="126" stroke="#8a5aad" stroke-width="0.7" stroke-opacity="0.4"/>
              <circle cx="146" cy="98" r="4.5" fill="none" stroke="#8a5aad" stroke-width="0.9" opacity="0.7"/>
              <rect x="143" y="103" width="7" height="12" rx="3" fill="none" stroke="#8a5aad" stroke-width="0.8" opacity="0.6"/>
            </g>

            <!-- cryo mist between pods -->
            <g fill="#8a5aad" opacity="0.10">
              <ellipse cx="80" cy="168" rx="26" ry="6"/>
              <ellipse cx="106" cy="174" rx="30" ry="7"/>
              <ellipse cx="140" cy="166" rx="24" ry="5"/>
            </g>

            <!-- snowflake crystals -->
            <g filter="url(#glow)">
              <g stroke="#8a5aad" stroke-width="0.7" opacity="0.6">
                <line x1="52" y1="66" x2="52" y2="52"/>
                <line x1="46" y1="59" x2="58" y2="59"/>
                <line x1="52" y1="66" x2="58" y2="62"/>
                <line x1="52" y1="66" x2="46" y2="62"/>
                <line x1="52" y1="52" x2="48" y2="48"/>
                <line x1="52" y1="52" x2="56" y2="48"/>
              </g>
              <g stroke="#8a5aad" stroke-width="0.7" opacity="0.5">
                <line x1="148" y1="70" x2="148" y2="56"/>
                <line x1="142" y1="63" x2="154" y2="63"/>
                <line x1="148" y1="70" x2="154" y2="66"/>
                <line x1="148" y1="70" x2="142" y2="66"/>
              </g>
              <circle cx="76" cy="56" r="1" fill="#8a5aad" opacity="0.5"/>
              <circle cx="126" cy="62" r="1.2" fill="#8a5aad" opacity="0.45"/>
              <circle cx="166" cy="98" r="1" fill="#8a5aad" opacity="0.4"/>
            </g>

            <!-- temp labels -->
            <g font-family="'Courier New', monospace" fill="#8a5aad" opacity="0.3" font-size="5" letter-spacing="1">
              <text x="96" y="42">STASIS</text>
              <text x="96" y="184">-196°C</text>
              <text x="42" y="176">CRYO</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">WHEN LEADING OR FOLLOWING:</div>
          <div class="room-desc">You may move each performing dweller to your OVERSEER'S SAFE after it resolves its action.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">HIGH-TECH COMPONENTS</div>

  </div>
</div>

</body>
</html>
