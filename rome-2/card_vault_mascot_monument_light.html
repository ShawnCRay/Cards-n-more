<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #8a5aad;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(138,90,173,0.04) 2px, rgba(138,90,173,0.04) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(138,90,173,0.2);
    border-right: 1px solid rgba(138,90,173,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(138,90,173,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .purple {
    color: #8a5aad;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #8a5aad;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(138,90,173,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(138,90,173,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #8a5aad;
    border-bottom: 1px dashed rgba(138,90,173,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(138,90,173,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #8a5aad;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Vault Mascot Monument - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="purple">Vault Mascot</span> Monument</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#8a5aad" stroke="#6a3a8d" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#6a3a8d" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">RECRUITER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8a5aad" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#8a5aad" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="statueGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#8a5aad" stop-opacity="0.12"/>
                <stop offset="50%" stop-color="#8a5aad" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#8a5aad" stop-opacity="0.08"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#8a5aad" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- the mascot statue on its plinth -->
            <g filter="url(#glow)">
              <!-- plinth -->
              <path d="M70 150 L 130 150 L 130 164 L 70 164 Z" fill="url(#statueGrad)" stroke="#8a5aad" stroke-width="1.2" opacity="0.8"/>
              <!-- statue: vault boy bust -->
              <circle cx="100" cy="86" r="16" fill="none" stroke="#8a5aad" stroke-width="1.4" opacity="0.85"/>
              <!-- smile -->
              <path d="M94 90 Q 100 96 106 90" fill="none" stroke="#8a5aad" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
              <!-- thumb up arm -->
              <path d="M100 102 L 100 128 L 100 140" stroke="#8a5aad" stroke-width="1.1" opacity="0.75"/>
              <rect x="94" y="124" width="12" height="6" rx="2" fill="none" stroke="#8a5aad" stroke-width="0.9" opacity="0.7"/>
              <!-- base of body -->
              <rect x="90" y="128" width="20" height="14" rx="2" fill="none" stroke="#8a5aad" stroke-width="1" opacity="0.75"/>
            </g>

            <!-- any SITE build: interchangeable site markers -->
            <g filter="url(#glow)">
              <rect x="42" y="120" width="18" height="14" rx="1.5" fill="none" stroke="#8a5aad" stroke-width="0.8" opacity="0.65"/>
              <rect x="140" y="120" width="18" height="14" rx="1.5" fill="none" stroke="#8a5aad" stroke-width="0.8" opacity="0.65"/>
              <path d="M62 126 L 70 126 M46 128 L 44 124 M50 128 L 46 122" fill="none" stroke="#8a5aad" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            </g>

            <!-- +3 caps endgame -->
            <g filter="url(#glow)">
              <circle cx="126" cy="52" r="8" fill="none" stroke="#8a5aad" stroke-width="0.9" opacity="0.7"/>
              <path d="M112 48 L 122 48 M126 44 A 4 4 0 1 0 130 47" fill="none" stroke="#8a5aad" stroke-width="0.8" opacity="0.6"/>
              <text x="92" y="52" font-family="'Courier New', monospace" fill="#8a5aad" font-size="9" opacity="0.6">+3</text>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#8a5aad" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="70" y="38">MASCOT</text>
              <text x="72" y="178">MONUMENT</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">PASSIVE:</div>
          <div class="room-desc">May build this blueprint on any SITE. Endgame: +3 Caps.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">HIGH-TECH COMPONENTS</div>

  </div>
</div>

</body>
</html>
