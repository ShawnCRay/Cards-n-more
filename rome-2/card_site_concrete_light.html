<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #6a7280;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .inner-wrap {
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .site-top {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 1mm;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.2mm;
  }

  .pop-row {
    display: flex;
    gap: 1.2mm;
    align-items: center;
    justify-content: center;
  }

  .pop-circle {
    width: 4.6mm;
    height: 4.6mm;
    border: 0.5mm solid #6a7280;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pop-circle svg {
    width: 70%;
    height: 70%;
    display: block;
  }

  .site-name {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #241d12;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .site-image {
    flex: 3;
    min-height: 0;
    margin-top: 1.2mm;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .site-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .foundation {
    flex: 2;
    min-height: 0;
    margin-top: 1.2mm;
    border: 1.5px solid rgba(141,146,155,0.4);
    border-radius: 2mm;
    padding: 1mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 1.6mm,
        rgba(106,114,128,0.10) 1.6mm, rgba(106,114,128,0.10) 3.2mm),
      repeating-linear-gradient(-45deg, transparent, transparent 1.6mm,
        rgba(106,114,128,0.10) 1.6mm, rgba(106,114,128,0.10) 3.2mm);
  }

  .foundation .f-title {
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #464c57;
    margin-bottom: 0.6mm;
  }

  .foundation .f-body {
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #241d12;
  }
</style>
<title>Concrete Site Front - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="site-top">
      <div class="pop-row">
        <div class="pop-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="3.5" fill="#6a7280"/>
            <path d="M5.5 19 c0 -4.5 13 -4.5 13 0 z" fill="#6a7280"/>
          </svg>
        </div>
        <div class="pop-circle">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8.5" r="3.5" fill="#6a7280"/>
            <path d="M5.5 19 c0 -4.5 13 -4.5 13 0 z" fill="#6a7280"/>
          </svg>
        </div>
      </div>
      <div class="site-name">Concrete</div>
    </div>

    <div class="site-image">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6a7280" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#6a7280" stop-opacity="0.03"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <rect width="200" height="200" fill="#ffffff"/>
        <rect width="200" height="200" fill="url(#bgGrad)"/>

        <!-- engineering grid -->
        <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
          <line x1="40" y1="0" x2="40" y2="200"/>
          <line x1="80" y1="0" x2="80" y2="200"/>
          <line x1="120" y1="0" x2="120" y2="200"/>
          <line x1="160" y1="0" x2="160" y2="200"/>
          <line x1="0" y1="40" x2="200" y2="40"/>
          <line x1="0" y1="80" x2="200" y2="80"/>
          <line x1="0" y1="120" x2="200" y2="120"/>
          <line x1="0" y1="160" x2="200" y2="160"/>
        </g>

        <!-- concrete blocks and bricks -->
        <g filter="url(#glow)">
          <path d="M96 60 L 90 88 L 110 88 L 116 60 Z" fill="none" stroke="#6a7280" stroke-width="1.3" stroke-opacity="0.7"/>
          <rect x="60" y="92" width="44" height="24" rx="2" fill="none" stroke="#6a7280" stroke-width="1.2" stroke-opacity="0.8"/>
          <rect x="104" y="92" width="36" height="24" rx="2" fill="none" stroke="#6a7280" stroke-width="1.2" stroke-opacity="0.8"/>
          <rect x="74" y="118" width="56" height="26" rx="2" fill="none" stroke="#6a7280" stroke-width="1.3" stroke-opacity="0.85"/>
        </g>

        <!-- brick stack -->
        <g filter="url(#glow)">
          <rect x="130" y="60" width="34" height="12" rx="1.5" fill="none" stroke="#6a7280" stroke-width="1" stroke-opacity="0.6"/>
          <rect x="134" y="72" width="30" height="12" rx="1.5" fill="none" stroke="#6a7280" stroke-width="1" stroke-opacity="0.6"/>
          <line x1="140" y1="60" x2="140" y2="72" stroke="#6a7280" stroke-width="0.5" opacity="0.4"/>
          <line x1="152" y1="60" x2="152" y2="72" stroke="#6a7280" stroke-width="0.5" opacity="0.4"/>
        </g>

        <!-- poured foundation forms -->
        <g filter="url(#glow)">
          <rect x="42" y="148" width="116" height="18" rx="2" fill="none" stroke="#6a7280" stroke-width="1.1" stroke-opacity="0.6"/>
          <line x1="68" y1="148" x2="68" y2="166" stroke="#6a7280" stroke-width="0.5" opacity="0.4"/>
          <line x1="100" y1="148" x2="100" y2="166" stroke="#6a7280" stroke-width="0.5" opacity="0.4"/>
          <line x1="132" y1="148" x2="132" y2="166" stroke="#6a7280" stroke-width="0.5" opacity="0.4"/>
        </g>

        <!-- label text -->
        <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
          <text x="54" y="40">WAREHOUSE</text>
          <text x="76" y="180">SITE</text>
        </g>
      </svg>
    </div>

    <div class="foundation">
      <div class="f-title">Foundation</div>
      <div class="f-body">+ 2 materials</div>
    </div>

  </div>
</div>

</body>
</html>
