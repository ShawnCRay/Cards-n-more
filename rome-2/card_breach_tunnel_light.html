<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #6a7280;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .gray {
    color: #6a7280;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #6a7280;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(141,146,155,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #6a7280;
    border-bottom: 1px dashed rgba(141,146,155,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Breach Tunnel - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="gray">Breach</span> Tunnel</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">OVERSEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.04"/>
              </linearGradient>
              <linearGradient id="tunnelGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.20"/>
                <stop offset="50%" stop-color="#6a7280" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.22"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- the tunnel cross-section -->
            <g filter="url(#glow)">
              <path d="M30 120 Q 100 96 170 120 L 170 176 Q 100 152 30 176 Z" fill="url(#tunnelGrad)" stroke="#6a7280" stroke-width="1.5" stroke-opacity="0.85"/>
              <path d="M30 120 Q 100 96 170 120" fill="none" stroke="#6a7280" stroke-width="1.2" stroke-opacity="0.5"/>
              <!-- tunnel ribs -->
              <path d="M56 122 Q 72 108 90 118" fill="none" stroke="#6a7280" stroke-width="0.8" stroke-opacity="0.4"/>
              <path d="M110 118 Q 128 108 144 122" fill="none" stroke="#6a7280" stroke-width="0.8" stroke-opacity="0.4"/>
              <path d="M80 152 Q 100 142 120 152" fill="none" stroke="#6a7280" stroke-width="0.8" stroke-opacity="0.35"/>
            </g>

            <!-- the stockpile vault (opponent) being breached on the right -->
            <g filter="url(#glow)">
              <rect x="150" y="136" width="34" height="34" rx="3" fill="none" stroke="#a03020" stroke-width="1.3" opacity="0.85"/>
              <rect x="156" y="142" width="22" height="22" rx="2" fill="none" stroke="#a03020" stroke-width="0.6" opacity="0.5"/>
              <!-- door ajar -->
              <line x1="150" y1="136" x2="184" y2="170" stroke="#a03020" stroke-width="1" opacity="0.7"/>
              <!-- materials inside -->
              <circle cx="164" cy="150" r="3" fill="none" stroke="#a03020" stroke-width="0.8" opacity="0.7"/>
              <circle cx="172" cy="158" r="3" fill="none" stroke="#a03020" stroke-width="0.8" opacity="0.7"/>
              <line x1="160" y1="155" x2="168" y2="155" stroke="#a03020" stroke-width="0.6" opacity="0.6"/>
            </g>

            <!-- an opposing HAND card being demanded (left) -->
            <g filter="url(#glow)">
              <rect x="18" y="150" width="22" height="30" transform="rotate(10 29 165)" fill="none" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <line x1="22" y1="155" x2="34" y2="155" stroke="#6a7280" stroke-width="0.5" opacity="0.5"/>
              <line x1="22" y1="159" x2="34" y2="159" stroke="#6a7280" stroke-width="0.5" opacity="0.5"/>
            </g>

            <!-- breach arrow indicating the demand -->
            <g filter="url(#glow)">
              <line x1="52" y1="150" x2="122" y2="150" stroke="#6a7280" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.7"/>
              <path d="M118 145 L 126 150 L 118 155" fill="none" stroke="#6a7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
            </g>

            <!-- rubble / debris of the dig -->
            <g fill="none" stroke="#6a7280" stroke-width="0.8" opacity="0.5">
              <circle cx="70" cy="130" r="2"/>
              <circle cx="86" cy="124" r="1.6"/>
              <circle cx="124" cy="132" r="1.8"/>
              <path d="M100 126 L 104 130 L 98 132 Z" fill="none"/>
            </g>

            <!-- movement ticks along the tunnel -->
            <g stroke="#6a7280" stroke-opacity="0.5" stroke-width="0.9" stroke-linecap="round">
              <line x1="70" y1="108" x2="78" y2="110"/>
              <line x1="100" y1="104" x2="108" y2="108"/>
              <line x1="132" y1="108" x2="140" y2="112"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="70" y="90">BREACH</text>
              <text x="124" y="60">UNDER</text>
              <text x="18" y="88">TUNNEL</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">RAIDER ACTION:</div>
          <div class="room-desc">May demand from opponents' STOCKPILES instead of their HANDS. Enemy Perimeter Fencing has no effect.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CONCRETE</div>

  </div>
</div>

</body>
</html>
