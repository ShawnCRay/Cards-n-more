<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #6a7280;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .gray {
    color: #6a7280;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #6a7280;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(141,146,155,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(141,146,155,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #6a7280;
    border-bottom: 1px dashed rgba(141,146,155,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Heavy Fabrication Area - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="gray">Heavy Fabrication</span> Area</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#6a7280" stroke="#464c57" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#464c57" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">OVERSEER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#6a7280" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#6a7280" stop-opacity="0.28"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- fabrication floor -->
            <g filter="url(#glow)">
              <rect x="34" y="96" width="132" height="78" rx="4" fill="url(#floorGrad)" stroke="#6a7280" stroke-width="1.4" stroke-opacity="0.85"/>
              <line x1="34" y1="118" x2="166" y2="118" stroke="#6a7280" stroke-width="0.6" stroke-opacity="0.35"/>
              <line x1="34" y1="146" x2="166" y2="146" stroke="#6a7280" stroke-width="0.6" stroke-opacity="0.35"/>
            </g>

            <!-- overhead gantry crane -->
            <g filter="url(#glow)">
              <line x1="30" y1="48" x2="170" y2="48" stroke="#6a7280" stroke-width="1.4" opacity="0.8"/>
              <rect x="120" y="48" width="34" height="6" fill="#6a7280" opacity="0.35" stroke="#6a7280" stroke-width="0.8" opacity="0.7"/>
              <!-- hook -->
              <line x1="137" y1="54" x2="137" y2="66" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <path d="M132 70 C 132 64 142 64 142 70" fill="none" stroke="#6a7280" stroke-width="1" opacity="0.6"/>
            </g>

            <!-- one half-assembled machine on the floor (scaffold, dashed) -->
            <g filter="url(#glow)">
              <rect x="96" y="128" width="48" height="34" fill="none" stroke="#6a7280" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="5 4"/>
              <line x1="96" y1="128" x2="144" y2="162" stroke="#6a7280" stroke-width="0.7" stroke-opacity="0.4"/>
              <line x1="144" y1="128" x2="96" y2="162" stroke="#6a7280" stroke-width="0.7" stroke-opacity="0.4"/>
              <!-- the block being lowered into place -->
              <rect x="120" y="96" width="22" height="16" rx="1" fill="none" stroke="#6a7280" stroke-width="0.9" opacity="0.7"/>
            </g>

            <!-- ENGINEER action mark: swing of the hammer -->
            <g filter="url(#glow)">
              <line x1="50" y1="150" x2="66" y2="140" stroke="#6a7280" stroke-width="1.2" opacity="0.7"/>
              <circle cx="66" cy="90" r="10" fill="none" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <path d="M66 82 L 66 98 M58 90 L 74 90" stroke="#6a7280" stroke-width="1" opacity="0.7"/>
              <!-- hammer handle -->
              <line x1="72" y1="128" x2="82" y2="120" stroke="#6a7280" stroke-width="1.2" opacity="0.6"/>
              <path d="M66 102 L 72 128" stroke="#6a7280" stroke-width="0.8" opacity="0.6"/>
            </g>

            <!-- population-linked action marks (n) -->
            <g filter="url(#glow)">
              <circle cx="100" cy="66" r="12" fill="none" stroke="#6a7280" stroke-width="1.2" opacity="0.8"/>
              <text x="93" y="71" font-family="'Courier New', monospace" fill="#6a7280" font-size="10" opacity="0.85">n</text>
              <line x1="138" y1="20" x2="138" y2="30" stroke="#6a7280" stroke-width="0.6" opacity="0.4"/>
            </g>

            <!-- sparks / metal glints by the weld -->
            <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <g fill="#6a7280" filter="url(#spark)">
              <circle cx="140" cy="132" r="1.2" opacity="0.8"/>
              <line x1="140" y1="128" x2="140" y2="126" stroke="#6a7280" stroke-width="0.6" opacity="0.6"/>
              <line x1="140" y1="136" x2="140" y2="138" stroke="#6a7280" stroke-width="0.6" opacity="0.6"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="54" y="176">WELD</text>
              <text x="112" y="176">FORGE</text>
              <text x="88" y="40">HEAVY</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">UPON COMPLETION:</div>
          <div class="room-desc">Execute 1 ENGINEER action for each POPULATION.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CONCRETE</div>

  </div>
</div>

</body>
</html>
