<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #b8452f;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(184,69,47,0.03) 2px, rgba(184,69,47,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(184,69,47,0.2);
    border-right: 1px solid rgba(184,69,47,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(184,69,47,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .red {
    color: #b8452f;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #b8452f;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(184,69,47,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(184,69,47,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #b8452f;
    border-bottom: 1px dashed rgba(184,69,47,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(184,69,47,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #b8452f;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Hydro-Kinetic Power Grid - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="red">Hydro-Kinetic</span> Power Grid</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#b8452f" stroke="#8a2e1c" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8a2e1c" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">RAIDER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="poolGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#b8452f" stop-opacity="0.20"/>
                <stop offset="100%" stop-color="#b8452f" stop-opacity="0.05"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>

            <rect width="200" height="200" fill="url(#poolGrad)"/>

            <!-- engineering grid lines -->
            <g stroke="#b8452f" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- transmission lines at top -->
            <g stroke="#b8452f" stroke-opacity="0.35">
              <line x1="15" y1="22" x2="185" y2="22" stroke-width="0.7"/>
              <line x1="15" y1="28" x2="185" y2="28" stroke-width="0.5" stroke-opacity="0.25"/>
              <line x1="15" y1="34" x2="185" y2="34" stroke-width="0.5" stroke-opacity="0.18"/>
            </g>
            <g stroke="#b8452f" stroke-opacity="0.4" stroke-width="1">
              <line x1="40" y1="12" x2="40" y2="34"/>
              <line x1="100" y1="12" x2="100" y2="34"/>
              <line x1="160" y1="12" x2="160" y2="34"/>
              <line x1="33" y1="18" x2="47" y2="18"/>
              <line x1="93" y1="18" x2="107" y2="18"/>
              <line x1="153" y1="18" x2="167" y2="18"/>
            </g>

            <!-- water intake channel from top-left -->
            <path d="M14 82 C 40 72, 62 80, 84 90" fill="none" stroke="#b8452f" stroke-width="3" stroke-opacity="0.30" stroke-linecap="round"/>
            <path d="M18 90 C 42 82, 62 88, 80 96" fill="none" stroke="#b8452f" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>

            <!-- falling water jets onto the wheel -->
            <g stroke="#b8452f" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)">
              <line x1="80" y1="96" x2="74" y2="120"/>
              <line x1="88" y1="96" x2="86" y2="124"/>
              <line x1="96" y1="98" x2="97" y2="126"/>
            </g>

            <!-- the turbine wheel -->
            <g filter="url(#glow)">
              <circle cx="105" cy="140" r="42" fill="none" stroke="#b8452f" stroke-width="1.6" stroke-opacity="0.85"/>
              <circle cx="105" cy="140" r="35" fill="none" stroke="#b8452f" stroke-width="0.7" stroke-opacity="0.35"/>
              <circle cx="105" cy="140" r="10" fill="none" stroke="#b8452f" stroke-width="1.3" stroke-opacity="0.75"/>
              <circle cx="105" cy="140" r="3.5" fill="#b8452f" opacity="0.7"/>
              <g stroke="#b8452f" stroke-width="1.1" stroke-opacity="0.6" fill="none">
                <line x1="105" y1="98" x2="105" y2="140"/>
                <line x1="105" y1="182" x2="105" y2="140"/>
                <line x1="63" y1="140" x2="105" y2="140"/>
                <line x1="147" y1="140" x2="105" y2="140"/>
                <line x1="75" y1="110" x2="105" y2="140"/>
                <line x1="135" y1="110" x2="105" y2="140"/>
                <line x1="135" y1="170" x2="105" y2="140"/>
                <line x1="75" y1="170" x2="105" y2="140"/>
              </g>
              <g stroke="#b8452f" stroke-width="1.3" stroke-opacity="0.7" fill="none">
                <path d="M105 98 A 42 42 0 0 1 121 103"/>
                <path d="M105 98 A 42 42 0 0 0 89 103"/>
                <path d="M105 182 A 42 42 0 0 1 89 177"/>
                <path d="M105 182 A 42 42 0 0 0 121 177"/>
                <path d="M63 140 A 42 42 0 0 1 68 124"/>
                <path d="M63 140 A 42 42 0 0 0 68 156"/>
                <path d="M147 140 A 42 42 0 0 1 142 156"/>
                <path d="M147 140 A 42 42 0 0 0 142 124"/>
              </g>
            </g>

            <!-- base water pool / splash -->
            <g filter="url(#glow)">
              <path d="M35 185 Q 60 177 85 185 T 135 185 T 185 185" fill="none" stroke="#b8452f" stroke-width="1.3" stroke-opacity="0.45" stroke-linecap="round"/>
              <path d="M45 193 Q 70 187 95 193 T 145 193 T 180 193" fill="none" stroke="#b8452f" stroke-width="1" stroke-opacity="0.22" stroke-linecap="round"/>
            </g>

            <!-- electricity arcs -->
            <g filter="url(#glow)">
              <path d="M96 94 L 90 82 L 99 84 L 93 70" fill="none" stroke="#b8452f" stroke-width="1.3" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M120 102 L 127 92 L 118 90 L 125 80" fill="none" stroke="#b8452f" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M108 92 L 112 82" fill="none" stroke="#b8452f" stroke-width="0.9" stroke-opacity="0.4" stroke-linecap="round"/>
            </g>

            <!-- energy sparks -->
            <g fill="#b8452f">
              <circle cx="148" cy="118" r="1.6" opacity="0.5"/>
              <circle cx="156" cy="132" r="1.2" opacity="0.4"/>
              <circle cx="64" cy="168" r="1.5" opacity="0.45"/>
              <circle cx="38" cy="130" r="1.2" opacity="0.35"/>
            </g>

            <!-- volt labels -->
            <g font-family="'Courier New', monospace" fill="#b8452f" opacity="0.3" font-size="5">
              <text x="150" y="78">KV</text>
              <text x="30" y="118">+</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">END OF TURN:</div>
          <div class="room-desc">If you led or followed SCAVENGER, use each OVERSEER dweller once.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">TECH MANUALS</div>

  </div>
</div>

</body>
</html>
