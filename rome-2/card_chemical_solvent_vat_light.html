<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #3f78a0;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(63,120,160,0.03) 2px, rgba(63,120,160,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(63,120,160,0.2);
    border-right: 1px solid rgba(63,120,160,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(63,120,160,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .blue {
    color: #3f78a0;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #3f78a0;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(63,120,160,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(63,120,160,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #3f78a0;
    border-bottom: 1px dashed rgba(63,120,160,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(63,120,160,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #3f78a0;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Chemical Solvent Vat - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="blue">Chemical Solvent</span> Vat</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#3f78a0" stroke="#2a5a85" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#2a5a85" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">TRADER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.08"/>
              </linearGradient>
              <linearGradient id="vatGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#3f78a0" stop-opacity="0.12"/>
                <stop offset="50%" stop-color="#3f78a0" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#3f78a0" stop-opacity="0.08"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>

            <rect width="200" height="200" fill="url(#liquidGrad)"/>

            <!-- engineering grid lines -->
            <g stroke="#3f78a0" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- dissolving blueprint card above the vat -->
            <g filter="url(#glow)">
              <g transform="translate(88,24) rotate(8)">
                <rect x="0" y="0" width="34" height="24" fill="#ffffff" stroke="#3f78a0" stroke-width="1" opacity="0.85"/>
                <line x1="4" y1="5" x2="20" y2="5" stroke="#3f78a0" stroke-width="0.7" opacity="0.6"/>
                <line x1="4" y1="10" x2="26" y2="10" stroke="#3f78a0" stroke-width="0.7" opacity="0.5"/>
                <line x1="4" y1="15" x2="14" y2="15" stroke="#3f78a0" stroke-width="0.7" opacity="0.4"/>
              </g>
              <circle cx="97" cy="56" r="1.2" fill="#3f78a0" opacity="0.55"/>
              <circle cx="112" cy="53" r="1" fill="#3f78a0" opacity="0.45"/>
              <circle cx="104" cy="61" r="1.4" fill="#3f78a0" opacity="0.3"/>
            </g>

            <!-- vapor rising -->
            <g fill="none" stroke="#3f78a0" stroke-width="1" stroke-linecap="round" filter="url(#glow)">
              <path d="M84 60 C 82 52, 88 48, 84 40" opacity="0.5"/>
              <path d="M100 58 C 102 50, 96 46, 100 38" opacity="0.4"/>
              <path d="M116 60 C 118 52, 112 48, 116 40" opacity="0.45"/>
            </g>

            <!-- the solvent vat -->
            <g filter="url(#glow)">
              <!-- outer drum -->
              <rect x="52" y="70" width="96" height="95" rx="4" fill="url(#vatGrad)" stroke="#3f78a0" stroke-width="1.5" stroke-opacity="0.85"/>
              <!-- top rim -->
              <ellipse cx="100" cy="70" rx="48" ry="12" fill="#ffffff" stroke="#3f78a0" stroke-width="1.5" stroke-opacity="0.85"/>
              <ellipse cx="100" cy="70" rx="38" ry="8" fill="url(#liquidGrad)" stroke="#3f78a0" stroke-width="0.8" stroke-opacity="0.4"/>
              <!-- drum bands -->
              <line x1="52" y1="112" x2="148" y2="112" stroke="#3f78a0" stroke-width="1" stroke-opacity="0.35"/>
              <line x1="52" y1="132" x2="148" y2="132" stroke="#3f78a0" stroke-width="1" stroke-opacity="0.35"/>
              <!-- solvent liquid with wavy surface -->
              <path d="M54 106 C 66 100, 78 112, 90 106 C 102 100, 114 112, 126 106 C 138 100, 146 108, 146 106 L 146 165 L 54 165 Z" fill="url(#liquidGrad)"/>
              <!-- drain spigot -->
              <rect x="148" y="142" width="13" height="6" fill="none" stroke="#3f78a0" stroke-width="1.2" opacity="0.6"/>
              <line x1="161" y1="145" x2="170" y2="145" stroke="#3f78a0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
            </g>

            <!-- bubbles in the solvent -->
            <g fill="none" stroke="#3f78a0" stroke-width="0.8" opacity="0.5">
              <circle cx="75" cy="128" r="3"/>
              <circle cx="90" cy="146" r="2"/>
              <circle cx="120" cy="126" r="2.5"/>
              <circle cx="132" cy="150" r="1.8"/>
              <circle cx="105" cy="156" r="1.2"/>
            </g>

            <!-- chemical molecule ring (left) -->
            <g filter="url(#glow)">
              <path d="M30 88 L 41 80 L 52 88 L 52 100 L 41 108 L 30 100 Z" fill="none" stroke="#3f78a0" stroke-width="1.2" opacity="0.5"/>
              <circle cx="30" cy="88" r="1.5" fill="#3f78a0" opacity="0.6"/>
              <circle cx="52" cy="88" r="1.5" fill="#3f78a0" opacity="0.6"/>
              <circle cx="30" cy="100" r="1.5" fill="#3f78a0" opacity="0.6"/>
              <circle cx="52" cy="100" r="1.5" fill="#3f78a0" opacity="0.6"/>
              <line x1="41" y1="80" x2="41" y2="68" stroke="#3f78a0" stroke-width="1" opacity="0.4"/>
              <circle cx="41" cy="66" r="2" fill="none" stroke="#3f78a0" stroke-width="0.9" opacity="0.5"/>
            </g>

            <!-- hazard markers -->
            <g fill="none" stroke="#3f78a0" stroke-width="1" opacity="0.4">
              <path d="M20 165 L 26 155 L 32 165 Z"/>
              <path d="M168 60 L 174 50 L 180 60 Z"/>
            </g>

            <!-- chemical formula labels -->
            <g font-family="'Courier New', monospace" fill="#3f78a0" opacity="0.3" font-size="5">
              <text x="130" y="122">H2O</text>
              <text x="22" y="122">Ca</text>
              <text x="156" y="166">Ca</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">DISMANTLE:</div>
          <div class="room-desc">ENGINEER Action: Dismantle one of your completed vault rooms. Return its blueprint to your HAND and its materials to your STOCKPILE.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">CHEMS</div>

  </div>
</div>

</body>
</html>
