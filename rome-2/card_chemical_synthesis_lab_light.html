<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background: #ffffff;
    border: 2.5px solid #c89a3c;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(200,154,60,0.03) 2px, rgba(200,154,60,0.03) 4px
    );
  }

  .cap-dots {
    position: absolute;
    right: -0.1mm;
    transform: translateX(50%);
    top: 1mm;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
    z-index: 20;
    pointer-events: none;
  }

  .cap-dot {
    width: 3.2mm;
    height: 3.2mm;
    display: block;
  }

  .inner-wrap {
    border: 1px solid rgba(200,154,60,0.2);
    border-right: 1px solid rgba(200,154,60,0.45);
    margin: 2mm;
    padding: 2mm;
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1.5px solid rgba(200,154,60,0.3);
    padding-bottom: 1.8mm;
    margin-bottom: 1.8mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name .accent {
    color: #c89a3c;
  }

  .card-body {
    display: flex;
    gap: 2mm;
    flex: 1;
    min-height: 0;
  }

  .card-role-bar {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-size: 7.5pt;
    letter-spacing: 4px;
    color: #c89a3c;
    font-weight: 700;
    opacity: 0.85;
    border-right: 1.5px solid rgba(200,154,60,0.2);
    padding-right: 1.5mm;
    white-space: nowrap;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .card-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.8mm;
    min-width: 0;
  }

  .card-image-box {
    flex: 1.1;
    border: 1.5px solid rgba(200,154,60,0.3);
    border-radius: 2mm;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .card-image-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-text-box {
    flex: 0.9;
    border: 1px solid rgba(36,29,18,0.12);
    border-radius: 2mm;
    padding: 1.5mm;
    background: rgba(255,255,255,0.4);
    color: #241d12;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }

  .room-title {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 6pt;
    margin-bottom: 0.8mm;
    color: #c89a3c;
    border-bottom: 1px dashed rgba(200,154,60,0.2);
    padding-bottom: 0.5mm;
  }

  .room-desc {
    font-size: 5.8pt;
    line-height: 1.35;
    color: #241d12;
  }

  .card-footer {
    border-top: 1.5px solid rgba(200,154,60,0.3);
    padding-top: 1.8mm;
    margin-top: 1.8mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #c89a3c;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Chemical Synthesis Lab - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name"><span class="accent">Chemical Synthesis</span> Lab</span>
    </div>

    <div class="cap-dots">
      <svg class="cap-dot" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10.5" fill="#c89a3c" stroke="#a07820" stroke-width="1"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#a07820" stroke-width="0.8"/>
        <path d="M15.2 8.5 A 4.2 4.2 0 1 0 15.2 14.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/><line x1="9.5" y1="18" x2="15" y2="6.2" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="card-body">
      <div class="card-role-bar">SCAVENGER</div>

      <div class="card-center">
        <div class="card-image-box">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c89a3c" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#c89a3c" stop-opacity="0.03"/>
              </linearGradient>
              <linearGradient id="flaskGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c89a3c" stop-opacity="0.14"/>
                <stop offset="100%" stop-color="#c89a3c" stop-opacity="0.30"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="200" height="200" fill="#ffffff"/>
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- engineering grid -->
            <g stroke="#c89a3c" stroke-opacity="0.05" stroke-width="0.5">
              <line x1="40" y1="0" x2="40" y2="200"/>
              <line x1="80" y1="0" x2="80" y2="200"/>
              <line x1="120" y1="0" x2="120" y2="200"/>
              <line x1="160" y1="0" x2="160" y2="200"/>
              <line x1="0" y1="40" x2="200" y2="40"/>
              <line x1="0" y1="80" x2="200" y2="80"/>
              <line x1="0" y1="120" x2="200" y2="120"/>
              <line x1="0" y1="160" x2="200" y2="160"/>
            </g>

            <!-- lab bench -->
            <g filter="url(#glow)">
              <rect x="30" y="140" width="140" height="8" fill="none" stroke="#c89a3c" stroke-width="1.2" opacity="0.7"/>
              <rect x="30" y="148" width="140" height="6" fill="none" stroke="#c89a3c" stroke-width="0.6" opacity="0.45"/>
              <line x1="40" y1="154" x2="40" y2="172" stroke="#c89a3c" stroke-width="0.8" opacity="0.4"/>
              <line x1="160" y1="154" x2="160" y2="172" stroke="#c89a3c" stroke-width="0.8" opacity="0.4"/>
            </g>

            <!-- the main synthesis flask (Erlenmeyer) -->
            <g filter="url(#glow)">
              <path d="M86 50 L 86 74 C 82 78 82 82 84 84 L 70 118 C 100 118 130 118 116 84 C 118 82 118 78 114 74 L 114 50" fill="none" stroke="#c89a3c" stroke-width="1.5" stroke-opacity="0.9"/>
              <!-- neck -->
              <rect x="96" y="38" width="8" height="8" fill="none" stroke="#c89a3c" stroke-width="1" opacity="0.8"/>
              <!-- liquid inside -->
              <path d="M84 100 L 74 118 C 104 118 106 118 116 118 L 104 100 Z" fill="url(#flaskGrad)"/>
              <path d="M82 118 C 84 112 96 108 100 112 C 104 108 114 112 118 118 Z" fill="url(#flaskGrad)" opacity="0.8"/>
            </g>

            <!-- bubbling in the flask -->
            <g fill="none" stroke="#c89a3c" stroke-width="0.7" opacity="0.5">
              <circle cx="92" cy="110" r="2.4"/>
              <circle cx="102" cy="106" r="1.8"/>
              <circle cx="112" cy="112" r="2"/>
              <circle cx="98" cy="114" r="1.4"/>
            </g>

            <!-- rising reagent tube / feed on the top-left -->
            <g filter="url(#glow)">
              <line x1="60" y1="46" x2="94" y2="46" stroke="#c89a3c" stroke-width="1" opacity="0.5"/>
              <rect x="44" y="36" width="16" height="20" rx="2" fill="none" stroke="#c89a3c" stroke-width="1" opacity="0.6"/>
              <!-- dropper into neck -->
              <path d="M100 38 L 96 30 L 104 30 Z" fill="none" stroke="#c89a3c" stroke-width="0.9" opacity="0.6"/>
              <circle cx="100" cy="40" r="1.3" fill="none" stroke="#c89a3c" stroke-width="0.6" opacity="0.6"/>
            </g>

            <!-- gene/atom ring rear (chem blueprint motif) -->
            <g filter="url(#glow)">
              <ellipse cx="146" cy="56" rx="14" ry="8" fill="none" stroke="#c89a3c" stroke-width="0.9" opacity="0.5" transform="rotate(-15 146 56)"/>
              <ellipse cx="150" cy="56" rx="14" ry="8" fill="none" stroke="#c89a3c" stroke-width="0.6" opacity="0.35" transform="rotate(-15 150 56)"/>
              <circle cx="146" cy="56" r="2" fill="#c89a3c" opacity="0.6"/>
            </g>

            <!-- blueprint / schematic card being added -->
            <g filter="url(#glow)">
              <rect x="34" y="96" width="24" height="16" transform="rotate(-8 46 104)" fill="#ffffff" stroke="#c89a3c" stroke-width="0.8" opacity="0.8"/>
              <line x1="38" y1="100" x2="52" y2="100" stroke="#c89a3c" stroke-width="0.5" opacity="0.5"/>
              <line x1="38" y1="104" x2="54" y2="104" stroke="#c89a3c" stroke-width="0.5" opacity="0.4"/>
              <!-- arrow into flask -->
              <line x1="62" y1="106" x2="80" y2="104" stroke="#c89a3c" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
            </g>

            <!-- sparks / reaction glints -->
            <g fill="#c89a3c" opacity="0.6">
              <circle cx="120" cy="96" r="1.2"/>
              <circle cx="132" cy="110" r="1"/>
              <circle cx="124" cy="102" r="0.8"/>
            </g>

            <!-- text labels -->
            <g font-family="'Courier New', monospace" fill="#c89a3c" opacity="0.28" font-size="5" letter-spacing="2">
              <text x="66" y="76">SYNTH</text>
              <text x="140" y="86">H+</text>
              <text x="64" y="166">LAB</text>
              <text x="118" y="176">MIX</text>
            </g>
          </svg>
        </div>

        <div class="card-text-box">
          <div class="room-title">PASSIVE:</div>
          <div class="room-desc">You may use any material type when adding resources to a Chem blueprint.</div>
        </div>
      </div>
    </div>

    <div class="card-footer">SCRAP METAL</div>

  </div>
</div>

</body>
</html>
