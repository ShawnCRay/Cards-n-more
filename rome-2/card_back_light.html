<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 63.5mm;
    height: 88.9mm;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  .card-container {
    width: 63.5mm;
    height: 88.9mm;
    background-color: #ffffff;
    background-image: linear-gradient(
      180deg,
      rgba(106,114,128,0.10) 0%,
      rgba(106,114,128,0.03) 100%
    );
    border: 2.5px solid #8d879b;
    border-radius: 3.5mm;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.3),
      inset 0 0 0 1px rgba(255,255,255,0.15);
  }

  .card-container::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(141,146,155,0.03) 2px, rgba(141,146,155,0.03) 4px
    );
  }

  .inner-wrap {
    border: 1px solid rgba(141,146,155,0.2);
    border-right: 1px solid rgba(141,146,155,0.45);
    margin: 2mm;
    padding: 2mm;
    height: calc(100% - 4mm);
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .card-header {
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 1.5px solid rgba(141,146,155,0.3);
    padding-bottom: 1.4mm;
    margin-bottom: 1.4mm;
    flex-shrink: 0;
  }

  .card-name {
    color: #241d12;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-body {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .back-emblem {
    width: 100%;
    height: 100%;
    display: block;
  }

  .card-footer {
    border-top: 1.5px solid rgba(141,146,155,0.3);
    padding-top: 1.4mm;
    margin-top: 1.4mm;
    text-align: center;
    font-size: 7.5pt;
    letter-spacing: 3px;
    color: #6a7280;
    font-weight: 700;
    text-transform: uppercase;
    flex-shrink: 0;
  }
</style>
<title>Card Back - Light</title>
</head>
<body>

<div class="card-container">
  <div class="inner-wrap">

    <div class="card-header">
      <span class="card-name">Lux Vaultum</span>
    </div>

    <div class="card-body">
      <svg class="back-emblem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="1.2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- engineering grid -->
        <g stroke="#6a7280" stroke-opacity="0.05" stroke-width="0.5">
          <line x1="40" y1="0" x2="40" y2="200"/>
          <line x1="80" y1="0" x2="80" y2="200"/>
          <line x1="120" y1="0" x2="120" y2="200"/>
          <line x1="160" y1="0" x2="160" y2="200"/>
          <line x1="0" y1="40" x2="200" y2="40"/>
          <line x1="0" y1="80" x2="200" y2="80"/>
          <line x1="0" y1="120" x2="200" y2="120"/>
          <line x1="0" y1="160" x2="200" y2="160"/>
        </g>

        <!-- vault door emblem ring -->
        <g filter="url(#glow)">
          <circle cx="100" cy="100" r="62" fill="none" stroke="#6a7280" stroke-width="3" stroke-opacity="0.85"/>
          <circle cx="100" cy="100" r="56" fill="none" stroke="#6a7280" stroke-width="1" stroke-opacity="0.55"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#6a7280" stroke-width="0.8" stroke-dasharray="3 2.5" stroke-opacity="0.5"/>
        </g>

        <!-- Vault-Tec V -->
        <path d="M 70 72 L 100 132 L 130 72" fill="none" stroke="#6a7280" stroke-width="5" stroke-linecap="round" stroke-linejoin="miter" stroke-opacity="0.9" filter="url(#glow)"/>

        <!-- vault door tick marks on inner circle -->
        <g stroke="#6a7280" stroke-opacity="0.6" stroke-width="1.2">
          <line x1="100" y1="36" x2="100" y2="44"/>
          <line x1="100" y1="156" x2="100" y2="164"/>
          <line x1="36" y1="100" x2="44" y2="100"/>
          <line x1="156" y1="100" x2="164" y2="100"/>
          <line x1="55" y1="55" x2="60" y2="60"/>
          <line x1="145" y1="55" x2="140" y2="60"/>
          <line x1="55" y1="145" x2="60" y2="140"/>
          <line x1="145" y1="145" x2="140" y2="140"/>
        </g>

        <!-- hex bolts -->
        <g fill="#6a7280" opacity="0.45">
          <circle cx="100" cy="36" r="2.2"/>
          <circle cx="100" cy="164" r="2.2"/>
          <circle cx="36" cy="100" r="2.2"/>
          <circle cx="164" cy="100" r="2.2"/>
        </g>

        <!-- corner glyphs -->
        <g fill="none" stroke="#6a7280" stroke-width="1" stroke-opacity="0.35">
          <circle cx="70" cy="60" r="4"/>
          <circle cx="130" cy="60" r="4"/>
          <circle cx="70" cy="140" r="4"/>
          <circle cx="130" cy="140" r="4"/>
        </g>

        <!-- label text ring -->
        <g font-family="'Courier New', monospace" fill="#6a7280" opacity="0.28" font-size="5" letter-spacing="2">
          <text x="86" y="40">VAULT</text>
          <text x="90" y="172">TEC</text>
        </g>
      </svg>
    </div>

    <div class="card-footer">FOR THE COMMONWEALTH</div>

  </div>
</div>

</body>
</html>
