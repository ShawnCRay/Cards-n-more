<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>actors preview (book 2)</title>
<style>
 body{background:#20203a;color:#ddd;font:11px monospace;margin:8px}
 .it{display:inline-block;vertical-align:top;margin:3px;padding:3px;background:#2c2c48}
 .it.lt{background:#5c7c9c}
 .it.bk{background:#000}
 canvas{image-rendering:pixelated;margin-right:3px;vertical-align:bottom}
 h3{margin:6px 0 2px;color:#fc8}
</style></head><body>
<script>window.DCW={};</script>
<script src="../js/art_actors.js"></script>
<script>
// Preview of art_actors.js defs/procs (standalone rasterizer, same rules as art.js).
// ?f=regex filter  ?s=scale  ?skins=1 carl skins grid  ?lt=1 light bg  ?bk=1 black bg
// ?x=regex exclude  ?real=1 also load ../js/art.js and draw through DCW.art.sheet (checks the real rasterizer)
(function(){
  var q=new URLSearchParams(location.search), re=new RegExp(q.get('f')||'.'), ex=q.get('x')?new RegExp(q.get('x')):null, S=+(q.get('s')||3);
  var defs=DCW.artDefs, procs=DCW.artProcs, skins=DCW.artSkins;
  var po=q.get('pal');if(po){po.split(',').forEach(function(kv){var a=kv.split(':');Object.keys(defs).forEach(function(n){if(re.test(n))defs[n].pal=Object.assign({},defs[n].pal,(function(){var o={};o[a[0]]=a[1]==='null'?null:'#'+a[1];return o;})());});});}
  var cls='it'+(q.get('lt')?' lt':'')+(q.get('bk')?' bk':'');
  function rast(d,fi,pal){var c=document.createElement('canvas');c.width=d.w*S;c.height=d.h*S;var g=c.getContext('2d');
    var fr=d.frames[fi];for(var y=0;y<d.h;y++)for(var x=0;x<d.w;x++){var ch=fr[y][x];if(ch==='.'||ch===' ')continue;var col=pal[ch];
      if(col===undefined){col=ch==='k'?'#000':'#ff00ff';}if(!col)continue;g.fillStyle=col;g.fillRect(x*S,y*S,S,S);}return c;}
  function procCanvas(p,fi){var c=document.createElement('canvas');c.width=p.w;c.height=p.h;var g=c.getContext('2d');p.draw(g,fi,null);
    var c2=document.createElement('canvas');c2.width=p.w*S;c2.height=p.h*S;var g2=c2.getContext('2d');g2.imageSmoothingEnabled=false;g2.drawImage(c,0,0,p.w*S,p.h*S);return c2;}
  function box(label){var d=document.createElement('div');d.className=cls;d.innerHTML='<div>'+label+'</div>';document.body.appendChild(d);return d;}
  function ok(n){return re.test(n)&&!(ex&&ex.test(n));}
  var names=Object.keys(defs).filter(ok);
  if(q.get('combo')){ // Carl with Donut riding on his shoulder (uses DCW.artActorsKit.carlShoulder)
    var sh=DCW.artActorsKit.carlShoulder;
    function comp(cn,dn,view,flip){var cd=defs[cn],dd=defs[dn];var n=cd.frames.length;var W=40,H=36;var b=box(cn+' + '+dn+(flip?' (flip)':''));
      for(var f=0;f<Math.max(n,2);f++){var c=document.createElement('canvas');c.width=W*S;c.height=H*S;var g=c.getContext('2d');
        var ax=20,ay=H-1;function put(d,fi,x,y,fl){var src=rast(d,fi%d.frames.length,d.pal);var tmp=document.createElement('canvas');tmp.width=src.width;tmp.height=src.height;var tg=tmp.getContext('2d');
          if(fl){tg.translate(src.width,0);tg.scale(-1,1);}tg.drawImage(src,0,0);g.drawImage(tmp,Math.round(x-d.w/2)*S,(y-d.h)*S);}
        put(cd,f,ax,ay,flip);var o=sh[view];put(dd,f,ax+(flip?-o.dx:o.dx),ay+o.dy,flip);b.appendChild(c);}}
    names.filter(function(n){return /^carl_back_/.test(n);}).forEach(function(n){comp(n,'donut_back','back',false);});
    ['carl_idle','carl_run','carl_punch','carl_throw','carl_jump'].forEach(function(n){comp(n,'donut_shoulder','side',false);comp(n,'donut_shoulder','side',true);});
  } else if(q.get('skins')){
    Object.keys(skins).forEach(function(s){var h=document.createElement('h3');h.textContent=s;document.body.appendChild(h);
      names.filter(function(n){return n.indexOf('carl_')===0;}).forEach(function(n){var d=defs[n],pal=Object.assign({},d.pal,skins[s].pal);
        var b=box(n.replace('carl_',''));for(var i=0;i<d.frames.length;i++)b.appendChild(rast(d,i,pal));});});
  } else if(q.get('real')){
    var sc=document.createElement('script');sc.src='../js/art.js';sc.onload=function(){
      try{DCW.art.init();}catch(e){console.error('art.init',e);}
      names.concat(Object.keys(procs).filter(ok)).forEach(function(n){var sh=DCW.art.sheet(n);if(!sh){console.error('no sheet '+n);return;}
        var b=box(n+' '+sh.w+'x'+sh.h+' f'+sh.frames);var c=document.createElement('canvas');c.width=sh.canvas.width*S;c.height=sh.canvas.height*S;
        var g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(sh.canvas,0,0,c.width,c.height);b.appendChild(c);});
      done();};document.body.appendChild(sc);return;
  } else {
    names.forEach(function(n){var d=defs[n];var b=box(n+' '+d.w+'x'+d.h+(d.frames.length>1?' f'+d.frames.length:''));
      d.frames.forEach(function(f,i){b.appendChild(rast(d,i,d.pal));});});
    Object.keys(procs).filter(ok).forEach(function(n){var p=procs[n];var b=box('[proc] '+n+' '+p.w+'x'+p.h);
      for(var i=0;i<(p.frames||1);i++)b.appendChild(procCanvas(p,i));});
  }
  function done(){var info=document.createElement('div');info.textContent='defs:'+Object.keys(defs).length+' procs:'+Object.keys(procs).length+' carlChars:'+(DCW.artActorsKit&&DCW.artActorsKit.carlCharsUsed);document.body.appendChild(info);}
  done();
})();
</script></body></html>
