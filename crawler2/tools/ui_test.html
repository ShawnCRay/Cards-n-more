<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DCW2 UI test</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
  #wrap { position: relative; }
  #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #touch { display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="320" height="180"></canvas></div>
<div id="touch"></div>
<!-- ui_test.html?screen=NAME (see ui_fixtures.js); add &realdata to use js/data.js, &noart to test fallbacks -->
<script src="../js/engine.js"></script>
<script>if (DCW.params.has('realdata')) document.write('<script src="../js/data.js"><\/script>');</script>
<script src="ui_fixtures_data.js"></script>
<script>if (!DCW.params.has('noart')) { document.write('<script src="../js/art_actors.js"><\/script>'); document.write('<script src="../js/art.js"><\/script>'); }</script>
<script src="../js/audio.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game.js"></script>
<script src="ui_fixtures.js"></script>
<script>DCW.boot();</script>
</body>
</html>
